<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- Auto-upgrade any http:// subresource (e.g. external images embedded in
     notes) to https:// — keeps the page from dropping to "not secure" when a
     note references an http image, and avoids serving mixed content. -->
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>知识库阅读器</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<meta name="theme-color" content="#B8860B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="知识库">
<meta name="mobile-web-app-capable" content="yes">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg-side:#fff;--bg-side-hover:#f7f7f7;--bg-side-active:#f2f0ed;
  --gold:#B8860B;--gold-light:#D4A942;--gold-faint:rgba(184,134,11,.08);
  --text:#353535;--text-2:#666;--text-3:#999;--text-title:#1a1a1a;
  --border:#ebebeb;--border-lt:#f5f5f5;
  --quote-bg:#fafafa;--code-bg:#f6f6f6;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono","Fira Code",Consolas,monospace;
  --side-w:280px;--fs:18px;--lh:2.0;--max-w:min(960px, 100%);--tr:.15s ease;
  --read-color:#aaa;
}
.dark{
  --bg:#1a1a1a;--bg-side:#1e1e1e;--bg-side-hover:#262626;--bg-side-active:#2e2e2e;
  --gold:#D4A942;--gold-light:#E0BF6A;--gold-faint:rgba(212,169,66,.1);
  --text:#ccc;--text-2:#999;--text-3:#666;--text-title:#e5e5e5;
  --border:#333;--border-lt:#2a2a2a;
  --quote-bg:#222;--code-bg:#252525;
  --read-color:#555;
}
.eye-care{
  --bg:#f5f0e1;--bg-side:#f0ead6;--bg-side-hover:#ebe5d0;--bg-side-active:#e5dfc8;
  --gold:#A07830;--gold-light:#C09840;--gold-faint:rgba(160,120,48,.1);
  --text:#4a4a3a;--text-2:#6a6a5a;--text-3:#8a8a7a;--text-title:#3a3a2a;
  --border:#d8d0b8;--border-lt:#e8e0c8;
  --quote-bg:#ede7d4;--code-bg:#eee8d5;
  --read-color:#b0a890;
}
html{font-size:16px}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:var(--lh);overflow:hidden;height:100vh;transition:background var(--tr),color var(--tr);overscroll-behavior:none}
html{overflow-x:hidden}
.app{display:flex;height:100vh}

/* ── Login ───────────────────────────────────────────── */
.login-overlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center}
.login-box{text-align:center;max-width:320px;padding:0 24px}
.login-box .ico{font-size:44px;margin-bottom:14px}
.login-box h2{font-size:20px;font-weight:700;color:var(--text-title);margin-bottom:20px}
.login-box input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:6px;font-size:15px;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;text-align:center}
.login-box input:focus{border-color:var(--gold)}
.login-box .login-btn{margin-top:12px;width:100%;padding:10px;border:none;border-radius:6px;background:var(--gold);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font)}
.login-box .login-btn:hover{background:var(--gold-light)}
.login-box .login-err{color:#e74c3c;font-size:13px;margin-top:8px;min-height:18px}

/* ── Sidebar ─────────────────────────────────────────── */
.side{width:var(--side-w);min-width:var(--side-w);height:100vh;background:var(--bg-side);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .25s ease,background var(--tr);z-index:100}
.side-hd{padding:20px 16px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.side-brand{display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer}
.side-brand h1{font-size:15px;font-weight:700;color:var(--text-title);letter-spacing:.3px}
.side-brand .ico{width:24px;height:24px;border-radius:4px;object-fit:cover}
.sbox{position:relative}
.sbox input{width:100%;padding:7px 10px 7px 32px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;font-family:var(--font);outline:none;transition:border-color var(--tr)}
.sbox input:focus{border-color:var(--gold)}
.sbox input::placeholder{color:var(--text-3)}
.sbox .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:13px;pointer-events:none}
.side-nav{flex:1;overflow-y:auto;padding:6px 0}
.side-nav::-webkit-scrollbar{width:3px}
.side-nav::-webkit-scrollbar-track{background:transparent}
.side-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.side-ft{padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}

/* Category / article items */
.cg{margin-bottom:1px}
.ch{display:flex;align-items:center;justify-content:space-between;padding:7px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);user-select:none;transition:background var(--tr)}
.ch:hover{background:var(--bg-side-hover)}
.ch .cnt{font-size:11px;color:var(--text-3);font-weight:400;background:var(--border-lt);padding:1px 6px;border-radius:10px}
.ch .arr{font-size:9px;color:var(--text-3);transition:transform .15s;margin-right:6px;display:inline-block}
.ch.open .arr{transform:rotate(90deg)}
.ci{display:none}.ci.open{display:block}

/* Subcategory (recursive depth) */
.sh{display:flex;align-items:center;padding:5px 16px 5px 26px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text-3);user-select:none;transition:background var(--tr)}
.sh:hover{background:var(--bg-side-hover);color:var(--text-2)}
.sh .arr{font-size:8px;color:var(--text-3);transition:transform .15s;margin-right:5px;display:inline-block}
.sh.open .arr{transform:rotate(90deg)}
.si-items{display:none}.si-items.open{display:block}

.ai{display:flex;align-items:center;padding:5px 16px 5px 34px;font-size:13px;color:var(--text-2);cursor:pointer;transition:background var(--tr),color var(--tr);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;position:relative;gap:6px}
.ai.sub{padding-left:46px}
.ai:hover{background:var(--bg-side-hover);color:var(--text)}
.ai.active{color:var(--gold);font-weight:600;background:var(--gold-faint)}
.ai.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--gold);border-radius:0 2px 2px 0}
.ai .at{flex:1;overflow:hidden;text-overflow:ellipsis}
.ai .rd{font-size:10px;color:var(--read-color);flex-shrink:0}
.ai.read .at{color:var(--read-color)}

/* ── Main ────────────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 24px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;transition:background var(--tr);gap:8px}
.tb-l{display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:1;overflow:hidden}
.tb-r{display:flex;align-items:center;gap:10px;flex-shrink:0}
.ham{display:none;background:none;border:none;font-size:20px;color:var(--text-2);cursor:pointer;padding:4px}
.bc{font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:0}
.bc-seg{cursor:pointer;transition:color var(--tr);padding:2px 0}
.bc-seg:hover{color:var(--gold)}
.bc-sep{margin:0 4px;color:var(--text-3);flex-shrink:0}
.bc-leaf{color:var(--text-2);cursor:default;overflow:hidden;text-overflow:ellipsis}
.tb-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:3px 9px;font-size:13px;color:var(--text-2);cursor:pointer;font-family:var(--font);transition:all var(--tr);white-space:nowrap}
.tb-btn:hover{border-color:var(--gold-light);color:var(--text)}

.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:40px 24px 80px;touch-action:pan-y pinch-zoom;overscroll-behavior-x:none}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Article ─────────────────────────────────────────── */
.article{max-width:var(--max-w);margin:0 auto}
.art-hd{margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--border-lt)}
.art-hd h1{font-size:26px;font-weight:700;line-height:1.4;color:var(--text-title);margin-bottom:10px}
.art-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--text-3)}
.art-meta .tag{display:inline-block;padding:2px 10px;background:var(--border-lt);border-radius:12px;font-size:12px;color:var(--text-2)}
a.wl{color:#5b8af0;text-decoration:none;border-bottom:1px dashed #5b8af0;cursor:pointer;transition:color .2s,border-color .2s}
a.wl:hover{color:#3a6ed8;border-bottom-color:#3a6ed8}
.wl-broken{color:var(--text-3);border-bottom:1px dashed var(--text-3);cursor:default}
.art-meta .author{color:var(--gold)}

/* Body typography */
/* Read toggle button */
.art-actions{margin-top:12px}
.art-ft{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:32px;padding-top:20px;border-top:1px solid var(--border)}
.read-toggle{display:inline-flex;align-items:center;gap:4px;padding:6px 16px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text-2);font-size:13px;font-family:var(--font);cursor:pointer;transition:all var(--tr)}
.read-toggle:hover{border-color:var(--gold-light);color:var(--gold)}
.read-toggle.is-read{background:var(--gold-faint);border-color:var(--gold);color:var(--gold)}
.nav-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 16px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text-2);font-size:13px;font-family:var(--font);cursor:pointer;transition:all var(--tr)}
.nav-btn:hover{border-color:var(--gold-light);color:var(--gold)}

.art-body{font-size:var(--fs);line-height:var(--lh);letter-spacing:.2px}
.art-body p{margin-bottom:1.5em;text-align:justify}
.art-body h1{font-size:1.5em;font-weight:700;margin:2em 0 .8em;color:var(--text-title);line-height:1.4}
.art-body h2{font-size:1.3em;font-weight:700;margin:1.8em 0 .7em;color:var(--text-title);line-height:1.4;padding-bottom:6px;border-bottom:2px solid var(--border)}
.art-body h3{font-size:1.12em;font-weight:700;margin:1.5em 0 .6em;color:var(--text-title)}
.art-body h4,.art-body h5,.art-body h6{font-size:1em;font-weight:700;margin:1.3em 0 .5em;color:var(--text-2)}
.art-body blockquote{margin:1.5em 0;padding:14px 18px;border-left:3px solid var(--gold);background:var(--quote-bg);border-radius:0 4px 4px 0;font-size:.95em;color:var(--text-2)}
.art-body blockquote p{margin-bottom:.6em}
.art-body blockquote p:last-child{margin-bottom:0}
.art-body ul,.art-body ol{margin:1em 0 1.5em;padding-left:1.8em}
.art-body li{margin-bottom:.4em}
.art-body li>ul,.art-body li>ol{margin:.3em 0}
.art-body strong{font-weight:700;color:var(--text-title)}
.art-body em{font-style:italic}
.art-body sup{font-size:.72em;font-weight:600;color:var(--gold);vertical-align:super;line-height:0;padding:0 1px}
.art-body sub{font-size:.72em;line-height:0}
.art-body>:first-child{margin-top:0}
.art-body a{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(184,134,11,.3);transition:color var(--tr)}
.art-body a:hover{color:var(--gold-light)}
.art-body code{font-family:var(--mono);font-size:.85em;background:var(--code-bg);padding:2px 5px;border-radius:3px;color:var(--gold)}
.art-body pre{margin:1.5em 0;padding:14px 18px;background:var(--code-bg);border-radius:6px;overflow-x:auto;font-size:.85em;line-height:1.6}
.art-body pre code{background:none;padding:0;color:var(--text)}
.art-body .md-table-wrap{margin:1.5em 0;overflow-x:auto;border:1px solid var(--border);border-radius:8px;-webkit-overflow-scrolling:touch}
.art-body table{width:100%;margin:0;border-collapse:collapse;font-size:.9em;line-height:1.6}
.art-body th,.art-body td{padding:8px 13px;text-align:center;vertical-align:middle;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.art-body th:last-child,.art-body td:last-child{border-right:none}
.art-body thead th{font-weight:600;color:var(--text-title);background:var(--bg-side-active);border-bottom:1px solid var(--border);white-space:nowrap}
.art-body tbody tr:nth-child(even){background:var(--bg-side-hover)}
.art-body tbody tr:hover{background:var(--bg-side-active)}
.art-body tbody tr:last-child td{border-bottom:none}
.art-body sup a.cref{cursor:pointer;border-bottom:1px dotted currentColor}
.art-body sup a.cref:hover{color:var(--gold-light)}
.art-body tr.cite-flash{animation:citeFlash 1.8s ease}
@keyframes citeFlash{0%,100%{background:transparent}12%{background:var(--gold-faint)}}
.art-body img{max-width:100%;height:auto;border-radius:4px;margin:1em 0}
.art-body hr{border:none;border-top:1px solid var(--border);margin:2em 0}
.audio-embed{margin:1.2em 0;padding:14px 16px;background:var(--quote-bg);border-radius:10px;border:1px solid var(--border-lt)}
.audio-embed .audio-label{font-size:14px;color:var(--text-2);margin-bottom:8px;font-weight:500}
.audio-embed audio{width:100%;height:40px;outline:none}
.video-embed{margin:1.2em 0}
.video-embed video{max-width:100%;border-radius:8px}

/* ── Welcome ─────────────────────────────────────────── */
.welcome{max-width:460px;margin:100px auto;text-align:center;padding:0 24px}
.welcome .ico{margin-bottom:14px}.welcome .ico img{width:64px;height:64px;border-radius:12px}
.welcome h2{font-size:20px;font-weight:700;margin-bottom:10px;color:var(--text-title)}
.welcome p{font-size:14px;color:var(--text-3);line-height:1.6}
.welcome .stats{margin-top:24px;display:flex;justify-content:center;gap:28px;flex-wrap:wrap}
.welcome .st .num{display:block;font-size:28px;font-weight:700;color:var(--gold)}
.welcome .st .lbl{font-size:12px;color:var(--text-3)}

/* Loading */
.ld{text-align:center;padding:60px 0;color:var(--text-3);font-size:14px}
.ld .sp{display:inline-block;width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Overlay */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:90}
.ov.on{display:block}

/* ── TTS 听书 ────────────────────────────────────── */
.tts-bar{display:none;align-items:center;gap:8px;padding:6px 14px calc(6px + env(safe-area-inset-bottom)) 14px;background:var(--bg);border-top:1px solid var(--border);flex-shrink:0;transition:background var(--tr)}
.tts-bar.on{display:flex}
.tts-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:4px 10px;font-size:13px;color:var(--text-2);cursor:pointer;font-family:var(--font);transition:all var(--tr);white-space:nowrap;display:flex;align-items:center;gap:4px}
.tts-btn:hover{border-color:var(--gold-light);color:var(--text)}
.tts-btn.active{border-color:var(--gold);color:var(--gold);background:var(--gold-faint)}
.tts-speed-wrap{position:relative;display:inline-flex;align-items:center}
.tts-speed-select{font-size:12px;color:var(--text-3);padding:2px 6px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-family:var(--font);appearance:none;-webkit-appearance:none;outline:none}
.tts-speed-select:hover{color:var(--text);background:var(--gold-faint)}
.tts-speed-select option{background:var(--bg);color:var(--text)}
.tts-progress{flex:1;height:3px;background:var(--border);border-radius:2px;cursor:pointer;position:relative;min-width:60px}
.tts-progress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s;width:0}
.tts-info{font-size:11px;color:var(--text-3);white-space:nowrap}
.tts-highlight{background:rgba(212,169,66,.18);border-radius:3px;transition:background .2s;cursor:pointer}
.dark .tts-highlight{background:rgba(212,169,66,.15)}
.inline-audio-paused.tts-highlight{background:rgba(212,169,66,.10);animation:ia-pulse 1.5s ease-in-out infinite}
.dark .inline-audio-paused.tts-highlight{background:rgba(212,169,66,.07)}
@keyframes ia-pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* Edit mode */
.edit-wrap{max-width:var(--max-w);margin:0 auto;display:flex;flex-direction:column;height:100%}
.edit-toolbar{display:flex;align-items:center;gap:8px;padding:12px 0;flex-shrink:0;position:sticky;top:0;background:var(--bg);z-index:10}
.edit-toolbar button{padding:6px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);border:1px solid var(--border);background:var(--bg);color:var(--text-2);transition:all var(--tr)}
.edit-toolbar button:hover{border-color:var(--gold-light);color:var(--text)}
.edit-toolbar .edit-save{background:var(--gold);color:#fff;border-color:var(--gold)}
.edit-toolbar .edit-save:hover{background:var(--gold-light)}
.edit-toolbar .edit-hint{font-size:12px;color:var(--text-3);margin-left:auto}
.edit-textarea{flex:1;width:100%;resize:none;border:1px solid var(--border);border-radius:8px;padding:16px 18px;font-family:var(--mono);font-size:14px;line-height:1.7;background:var(--bg);color:var(--text);outline:none;transition:border-color var(--tr);min-height:400px}
.edit-textarea:focus{border-color:var(--gold)}
.tb-btn.active{border-color:var(--gold);color:var(--gold);background:var(--gold-faint)}

/* Back to top */
.tts-slider::before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
#cfgTts:checked+.tts-slider{background:var(--gold)}
#cfgTts:checked+.tts-slider::before{transform:translateX(20px)}
.btt{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:24px;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#fff;border:none;font-size:16px;cursor:pointer;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;z-index:50;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.btt.vis{opacity:1;transform:translateY(0)}
.btt:hover{background:var(--gold-light)}

/* ── Share excerpt (书摘分享) ─────────────────────── */
.share-bar{position:fixed;display:none;align-items:center;gap:2px;padding:4px;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:150;transform:translateX(-50%);animation:shareIn .15s ease}
.share-bar.vis{display:flex}
@keyframes shareIn{from{opacity:0;transform:translateX(-50%) translateY(4px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.share-bar button{display:flex;align-items:center;gap:4px;padding:6px 12px;border:none;border-radius:5px;background:none;color:var(--text);font-size:13px;font-family:var(--font);cursor:pointer;white-space:nowrap;transition:background .12s}
.share-bar button:hover{background:var(--gold-faint);color:var(--gold)}
/* Mobile: fixed bottom bar to avoid system selection menu overlap */
.share-bar.mobile-bottom{position:fixed;left:0!important;right:0;bottom:0!important;top:auto!important;transform:none;width:100%;border-radius:16px 16px 0 0;padding:10px 8px calc(10px + env(safe-area-inset-bottom));justify-content:center;gap:4px;box-shadow:0 -4px 20px rgba(0,0,0,.15);animation:shareInMobile .2s ease}
.share-bar.mobile-bottom button{padding:10px 14px;font-size:14px}
@keyframes shareInMobile{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}

/* Share card overlay */
/* Share overlay */
.share-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.share-overlay.on{display:flex}
.share-card-wrap{position:relative;max-width:92vw;max-height:78vh;overflow:visible}

/* ── Card base ── */
.share-card{width:400px;max-width:88vw;border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.25);padding:40px 32px 28px;position:relative;font-family:var(--font);transition:all .25s ease}
.share-card .sc-quote{position:relative;margin-bottom:0}
.share-card .sc-text{font-size:16.5px;line-height:2;letter-spacing:.02em;position:relative;z-index:1;padding-left:4px}
.share-card .sc-src{padding-top:20px;margin-top:20px}
.share-card .sc-src .sc-title{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.04em;text-align:right}

/* ── Theme: Ink (水墨) ── */
.share-card.t-pure{background:#fff;color:#1a1a1a}
.share-card.t-pure .sc-text{color:#2a2a2a}

.share-card.t-pure .sc-src{border-top:1px solid rgba(0,0,0,.06)}
.share-card.t-pure .sc-title{color:#999;text-transform:uppercase}

/* ── Theme: Warm (暖纸) ── */
.share-card.t-literary{background:#faf6ef;color:#3a3028}
.share-card.t-literary .sc-text{color:#3a3028}

.share-card.t-literary .sc-src{border-top:1px solid rgba(160,120,60,.1)}
.share-card.t-literary .sc-title{color:#b8a080}

/* ── Theme: Night (暗夜) ── */
.share-card.t-dark{background:#1a1a22;color:#e0e0e0}
.share-card.t-dark .sc-text{color:#d4d4d4}

.share-card.t-dark .sc-src{border-top:1px solid rgba(255,255,255,.06)}
.share-card.t-dark .sc-title{color:#777}

/* ── Theme: Sage (青白) ── */
.share-card.t-green{background:#f4f7f4;color:#2a332a}
.share-card.t-green .sc-text{color:#2e3e2e}

.share-card.t-green .sc-src{border-top:1px solid rgba(80,140,80,.08)}
.share-card.t-green .sc-title{color:#8aaa8a}

/* ── Theme switcher ── */
.share-themes{display:flex;gap:8px;justify-content:center}
.share-themes button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.share-themes button:hover{transform:scale(1.15)}
.share-themes button.active{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.4),0 2px 8px rgba(0,0,0,.2)}
.share-themes .st-pure{background:#fff;border:1px solid #e0e0e0}
.share-themes .st-literary{background:#faf6ef;border:1px solid #e8dcc8}
.share-themes .st-dark{background:#1a1a22;border:1px solid #333}
.share-themes .st-green{background:#f4f7f4;border:1px solid #d0ddd0}

/* ── Action buttons ── */
.share-actions{display:flex;gap:8px}
.share-actions button{padding:9px 20px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s}
.share-actions .sa-copy{background:rgba(255,255,255,.9);color:#333;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.share-actions .sa-copy:hover{background:#fff}
.share-actions .sa-save{background:var(--gold);color:#fff}
.share-actions .sa-save:hover{background:var(--gold-light)}
.share-actions .sa-close{background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.2)}
.share-actions .sa-close:hover{background:rgba(255,255,255,.2);color:#fff}
@media(max-width:420px){
  .share-card{padding:32px 24px 22px}
  .share-card .sc-text{font-size:15px}
  .share-actions button{padding:8px 14px;font-size:12px}
  .share-actions{gap:6px}
}

/* Rescan button */
.rescan-btn{background:none;border:none;cursor:pointer;font-size:13px;color:var(--text-3);padding:2px 6px;border-radius:4px;transition:all var(--tr)}
.rescan-btn:hover{color:var(--gold);background:var(--gold-faint)}
.rescan-btn.spinning{animation:spin .7s linear infinite}

/* Settings modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:var(--bg);border-radius:10px;padding:24px;max-width:480px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal h3{font-size:16px;font-weight:700;color:var(--text-title);margin-bottom:16px}
.modal label{display:block;font-size:13px;color:var(--text-2);margin-bottom:4px}
.modal input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;margin-bottom:14px}
.modal input[type=text]:focus{border-color:var(--gold)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btns button{padding:6px 16px;border-radius:5px;font-size:13px;cursor:pointer;font-family:var(--font);border:1px solid var(--border);background:var(--bg);color:var(--text-2)}
.modal-btns button.primary{background:var(--gold);color:#fff;border-color:var(--gold)}
.modal-btns button:hover{opacity:.85}

/* ── Responsive ──────────────────────────────────────── */
@media(max-width:1024px){
  .side{position:fixed;left:0;top:0;transform:translateX(-100%)}
  .side.open{transform:translateX(0);box-shadow:4px 0 20px rgba(0,0,0,.06)}
  .ham{display:block}
}
@media(max-width:768px){
  .content{padding:20px 28px 60px}
  .art-hd h1{font-size:20px}
  .art-body{font-size:calc(var(--fs) - 1px);line-height:1.85}
  .art-body blockquote{padding:10px 14px}
  .art-body pre{padding:10px 12px;font-size:.8em}
  .toolbar{padding:6px 12px}
  .tb-r{gap:6px}
  .tb-btn{padding:2px 7px;font-size:12px}
  .welcome{margin:60px auto;padding:0 16px}
  .welcome h2{font-size:18px}
  .modal{padding:20px 16px;width:95%;max-height:85vh;overflow-y:auto}
  .login-box{padding:0 16px}
  .edit-toolbar .edit-hint{display:none}
  .edit-textarea{min-height:200px;font-size:13px;padding:12px 14px}
}
@media(max-width:420px){
  .content{padding:16px 24px 50px}
  .art-hd h1{font-size:18px}
  .art-body{font-size:calc(var(--fs) - 2px)}
  .bc{max-width:100px;font-size:11px}
  .side{width:80vw;min-width:80vw;max-width:340px}
  .btt{bottom:calc(16px + env(safe-area-inset-bottom));right:16px;width:34px;height:34px;font-size:14px}
  .toolbar{padding:6px 8px}
  .tb-r{gap:4px}
  .tb-btn{padding:2px 5px;font-size:11px}
}
/* ── Note modal ─────────────────────────── */
.note-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:250;align-items:center;justify-content:center}
.note-overlay.on{display:flex}
.note-modal{background:var(--bg);border-radius:12px;padding:24px;max-width:520px;width:92%;box-shadow:0 12px 40px rgba(0,0,0,.18);font-family:var(--font)}
.note-modal h3{font-size:16px;font-weight:700;color:var(--text-title);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.note-quote{margin-bottom:14px;padding:12px 16px;border-left:3px solid var(--gold);background:var(--quote-bg);border-radius:0 6px 6px 0;font-size:14px;color:var(--text-2);line-height:1.7;max-height:120px;overflow-y:auto}
.note-textarea{width:100%;min-height:100px;resize:vertical;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:var(--font);font-size:14px;line-height:1.7;background:var(--bg);color:var(--text);outline:none;transition:border-color var(--tr)}
.note-textarea:focus{border-color:var(--gold)}
.note-textarea::placeholder{color:var(--text-3)}
.note-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.note-btns button{padding:7px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);border:1px solid var(--border);background:var(--bg);color:var(--text-2);transition:all var(--tr)}
.note-btns button:hover{opacity:.85}
.note-btns .note-save{background:var(--gold);color:#fff;border-color:var(--gold)}
.note-btns .note-save:hover{background:var(--gold-light)}

/* ── Audio embed transcribe button ────────── */
.audio-embed-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.audio-sub-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border:1px solid var(--border);border-radius:16px;background:var(--bg);color:var(--text-2);font-size:12px;font-family:var(--font);cursor:pointer;transition:all var(--tr);white-space:nowrap}
.audio-sub-btn:hover{border-color:var(--gold-light);color:var(--gold)}
.audio-sub-btn.active{border-color:var(--gold);color:var(--gold);background:var(--gold-faint)}
.audio-sub-btn:disabled{opacity:.6;cursor:not-allowed}

/* Toast */
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(0,0,0,.78);color:#fff;border-radius:8px;font-size:14px;font-family:var(--font);z-index:9999;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.vis{opacity:1}

/* ── Annotation highlights (from 笔记.md) ── */
mark.ann-hl{background:rgba(255,235,59,.28);border-radius:2px;padding:0 1px;cursor:pointer;transition:background .2s}
mark.ann-note{background:rgba(76,175,80,.18);border-bottom:1.5px dashed rgba(76,175,80,.5);border-radius:2px;padding:0 1px;cursor:pointer;transition:background .2s}
mark.ann-hl:hover{background:rgba(255,235,59,.45)}
mark.ann-note:hover{background:rgba(76,175,80,.32)}
.ann-tooltip{position:fixed;max-width:300px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:13px;line-height:1.6;color:var(--text);z-index:160;pointer-events:none;opacity:0;transition:opacity .15s}
.ann-tooltip.vis{opacity:1}
.ann-tooltip .ann-tt-note{color:var(--text);margin-bottom:4px}
.ann-tooltip .ann-tt-date{color:var(--text-3);font-size:11px}
/* ── Annotation actions panel ── */
.ann-actions{position:fixed;display:none;align-items:center;gap:2px;padding:4px;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:170;transform:translateX(-50%);animation:annActIn .15s ease}
.ann-actions.vis{display:flex}
@keyframes annActIn{from{opacity:0;transform:translateX(-50%) translateY(4px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.ann-actions button{display:flex;align-items:center;gap:4px;padding:6px 12px;border:none;border-radius:5px;background:none;color:var(--text);font-size:13px;font-family:var(--font);cursor:pointer;white-space:nowrap;transition:background .12s}
.ann-actions button:hover{background:var(--gold-faint);color:var(--gold)}
.ann-actions .ann-act-del:hover{background:rgba(231,76,60,.1);color:#e74c3c}
/* ── Edit note modal ── */
.edit-note-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:250;align-items:center;justify-content:center}
.edit-note-overlay.on{display:flex}
.edit-note-modal{background:var(--bg);border-radius:12px;padding:24px;max-width:520px;width:92%;box-shadow:0 12px 40px rgba(0,0,0,.18);font-family:var(--font)}
.edit-note-modal h3{font-size:16px;font-weight:700;color:var(--text-title);margin-bottom:14px;display:flex;align-items:center;gap:6px}
/* ── Jump highlight flash animation ── */
@keyframes annFlash{0%{background:rgba(255,193,7,.5)}50%{background:rgba(255,193,7,.15)}100%{background:rgba(255,193,7,.5)}}
mark.ann-flash{animation:annFlash .5s ease 3}
/* ── Theme picker panel ─────────────────── */
.theme-panel{display:none;position:absolute;right:0;top:100%;margin-top:6px;background:var(--bg);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.12);z-index:160;padding:8px;min-width:160px;max-width:calc(100vw - 16px);animation:themeIn .15s ease}
@keyframes themeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.theme-panel.on{display:block}
.theme-panel-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;cursor:pointer;transition:background .12s;font-size:13px;color:var(--text);white-space:nowrap}
.theme-panel-item:hover{background:var(--bg-side-hover)}
.theme-panel-item.active{background:var(--gold-faint);color:var(--gold);font-weight:600}
.theme-panel-item .tp-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}
.theme-panel-item.active .tp-dot{border-color:var(--gold)}
.tp-dot-light{background:linear-gradient(135deg,#fff,#f5f5f5)}
.tp-dot-dark{background:linear-gradient(135deg,#2a2a2a,#1a1a1a)}
.tp-dot-eyecare{background:linear-gradient(135deg,#f5f0e1,#e5dfc8)}

*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
</style>
</head>
<body>

<!-- Login overlay -->
<div class="login-overlay" id="loginOverlay" style="display:none">
  <div class="login-box">
    <div class="ico">🔒</div>
    <h2>知识库阅读器</h2>
    <input type="password" id="loginPw" placeholder="请输入访问密码" autocomplete="current-password">
    <button class="login-btn" id="loginBtn">进入</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>⚙️ 设置</h3>
    <label>Obsidian Vault 路径</label>
    <input type="text" id="cfgVault" placeholder="/path/to/obsidian/vault">
    <div class="modal-btns" style="margin-bottom:18px">
      <button id="cfgCancel">取消</button>
      <button class="primary" id="cfgSave">保存并重新扫描</button>
    </div>
    <div style="border-top:1px solid var(--border);padding-top:14px;margin-bottom:18px">
      <h3 style="font-size:14px;margin-bottom:12px">🎧 功能开关</h3>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none">
        <span style="position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0">
          <input type="checkbox" id="cfgTts" checked style="opacity:0;width:0;height:0;position:absolute">
          <span class="tts-slider" style="position:absolute;pointer-events:none;inset:0;background:var(--border);border-radius:24px;transition:.3s"></span>
        </span>
        <span style="font-size:13px;color:var(--text)">TTS 听书功能</span>
        <span id="cfgTtsLabel" style="font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--gold);color:#fff">开</span>
      </label>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;margin-top:12px">
        <span style="position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0">
          <input type="checkbox" id="cfgDebug" style="opacity:0;width:0;height:0;position:absolute">
          <span class="tts-slider" style="position:absolute;pointer-events:none;inset:0;background:var(--border);border-radius:24px;transition:.3s"></span>
        </span>
        <span style="font-size:13px;color:var(--text)">字幕对齐 Debug</span>
        <span id="cfgDebugLabel" style="font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--text-3);color:#fff">关</span>
      </label>
    </div>
    <div style="border-top:1px solid var(--border);padding-top:14px">
      <h3 style="font-size:14px;margin-bottom:12px">🔒 修改密码</h3>
      <label>原密码</label>
      <input type="password" id="pwOld" placeholder="当前密码" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;margin-bottom:10px">
      <label>新密码<span style="color:var(--text-3);font-weight:400">  （留空则关闭密码）</span></label>
      <input type="password" id="pwNew" placeholder="新密码" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;margin-bottom:10px">
      <label>确认新密码</label>
      <input type="password" id="pwConfirm" placeholder="再次输入新密码" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;margin-bottom:10px">
      <div class="pw-msg" id="pwMsg" style="font-size:12px;min-height:16px;margin-bottom:8px"></div>
      <div class="modal-btns">
        <button class="primary" id="pwSave">修改密码</button>
      </div>
    </div>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <aside class="side" id="side">
    <div class="side-hd">
      <div class="side-brand"><img class="ico" src="/icon-192.png" alt="logo" style="width:24px;height:24px;border-radius:4px"><h1>知识库阅读器</h1></div>
      <div class="sbox"><span class="si">🔍</span><input type="text" id="search" placeholder="搜索文章..." autocomplete="off"></div>
    </div>
    <nav class="side-nav" id="snav"><div class="ld"><div class="sp"></div><div>加载目录中...</div></div></nav>
    <div class="side-ft" id="sft">
      <span></span>
      <span>
        <button class="rescan-btn" id="settings" title="设置">⚙️</button>
        <button class="rescan-btn" id="rescan" title="重新扫描 vault">🔄</button>
      </span>
    </div>
  </aside>
  <div class="ov" id="ov"></div>
  <main class="main">
    <div class="toolbar">
      <div class="tb-l"><button class="ham" id="ham">☰</button><span class="bc" id="bc"></span></div>
      <div class="tb-r">
        <button class="tb-btn" id="editToggle" title="编辑" style="display:none">📝</button>
        <button class="tb-btn" id="ttsToggle" title="听书">🎧</button>
        <button class="tb-btn" id="fdec">A-</button>
        <button class="tb-btn" id="frst" title="重置字体">A</button>
        <button class="tb-btn" id="finc">A+</button>
        <span style="position:relative"><button class="tb-btn" id="thm">🌙</button>
        <div class="theme-panel" id="themePanel">
          <div class="theme-panel-item active" data-theme="light"><span class="tp-dot tp-dot-light"></span>浅色</div>
          <div class="theme-panel-item" data-theme="dark"><span class="tp-dot tp-dot-dark"></span>深色</div>
          <div class="theme-panel-item" data-theme="eye-care"><span class="tp-dot tp-dot-eyecare"></span>护眼</div>
        </div></span>
      </div>
    </div>
    <div class="tts-bar" id="ttsBar">
      <button class="tts-btn" id="ttsPlay" title="播放/暂停">▶ 播放</button>
      <button class="tts-btn" id="ttsStop" title="停止">⏹</button>
      <div class="tts-progress" id="ttsProgress"><div class="tts-progress-fill" id="ttsProgressFill"></div></div>
      <span class="tts-info" id="ttsInfo"></span>
      <span class="tts-speed-wrap"><select class="tts-speed-select" id="ttsSpeed" title="语速"><option value="0.6">0.6x</option><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.5">1.5x</option><option value="1.8">1.8x</option><option value="2">2.0x</option></select></span>
    </div>
    <div class="content" id="ct">
      <div class="welcome" id="wc">
        <div class="ico"><img src="/icon-192.png" alt="logo"></div>
        <h2>知识库阅读器</h2>
        <p>你的个人知识库，沉浸式阅读体验。<br>从左侧选择一篇文章开始阅读。</p>
        <div class="stats" id="ws"></div>
      </div>
    </div>
  </main>
</div>
<button class="btt" id="btt">↑</button>

<!-- Share excerpt bar (appears on text selection) -->
<div class="share-bar" id="shareBar">
  <button id="shareTtsBtn">🎧 TTS</button>
  <button id="shareMp3Btn" style="display:none">🎵 从此处听(MP3)</button>
  <button id="shareExcerpt">📋 分享书摘</button>
  <button id="shareHighlight">🖍️ 划线</button>
  <button id="shareNote">📝 记笔记</button>
</div>

<!-- Note modal -->
<div class="note-overlay" id="noteOverlay">
  <div class="note-modal">
    <h3>📝 记笔记</h3>
    <div class="note-quote" id="noteQuote"></div>
    <textarea class="note-textarea" id="noteText" placeholder="写下你的想法..."></textarea>
    <div class="note-btns">
      <button id="noteCancel">取消</button>
      <button class="note-save" id="noteSave">保存</button>
    </div>
  </div>
</div>

<!-- Annotation tooltip -->
<div class="ann-tooltip" id="annTooltip"></div>

<!-- Annotation actions panel -->
<div class="ann-actions" id="annActions">
  <button id="annActEdit">✏️ 编辑</button>
  <button id="annActDel" class="ann-act-del">🗑️ 删除</button>
</div>

<!-- Edit note modal -->
<div class="edit-note-overlay" id="editNoteOverlay">
  <div class="edit-note-modal">
    <h3>✏️ 编辑笔记</h3>
    <div class="note-quote" id="editNoteQuote"></div>
    <textarea class="note-textarea" id="editNoteText" placeholder="写下你的想法..."></textarea>

<script>
!function(){"use strict";

const DEFAULT_FS=18;
let C=null,curId=null,fs=DEFAULT_FS,dark=false;
const $=id=>document.getElementById(id);
const app=$('app'),loginOverlay=$('loginOverlay'),loginPw=$('loginPw'),loginBtn=$('loginBtn'),loginErr=$('loginErr');
const side=$('side'),ov=$('ov'),snav=$('snav'),sft=$('sft'),search=$('search'),
      ct=$('ct'),bc=$('bc'),ham=$('ham'),thm=$('thm'),fdec=$('fdec'),frst=$('frst'),
      finc=$('finc'),btt=$('btt'),ws=$('ws'),rescan=$('rescan'),settings=$('settings');
const modalBg=$('modalBg'),cfgVault=$('cfgVault'),cfgCancel=$('cfgCancel'),cfgSave=$('cfgSave');
const pwOld=$('pwOld'),pwNew=$('pwNew'),pwConfirm=$('pwConfirm'),pwSave=$('pwSave'),pwMsg=$('pwMsg');

// ── Read state (per-id last-write-wins + tombstones) ──
// Mirrors the server model so cross-device unmark actually sticks. The old
// union-merge could only ever re-add ids, so an unmark on device A was
// resurrected by any stale peer B that still had the id locally.
//   _reads:  Map<id, ts>  when marked read
//   _tombs:  Map<id, ts>  when unmarked
// An id is "read" iff in _reads and its ts >= any tombstone ts. Maps are loaded
// once and cached (isRead is called per-article in renderSidebar).
let _reads=null, _tombs=null;
function _loadReadState(){
  if(_reads) return;
  _reads=new Map(); _tombs=new Map();
  try{
    const raw=localStorage.getItem('readState');
    if(raw){
      const o=JSON.parse(raw)||{};
      if(o.reads) for(const k in o.reads) _reads.set(k, Number(o.reads[k])||0);
      if(o.tombstones) for(const k in o.tombstones) _tombs.set(k, Number(o.tombstones[k])||0);
    }else{
      // Migrate legacy flat array (readArticles) → reads with ts=0.
      const old=JSON.parse(localStorage.getItem('readArticles')||'[]');
      if(Array.isArray(old)) for(const id of old) if(typeof id==='string') _reads.set(id,0);
    }
  }catch(e){ _reads=new Map(); _tombs=new Map(); }
}
function _saveReadState(){
  _loadReadState();
  try{
    const reads={},tombs={};
    for(const [k,v] of _reads) reads[k]=v;
    for(const [k,v] of _tombs) tombs[k]=v;
    localStorage.setItem('readState',JSON.stringify({reads,tombstones:tombs}));
  }catch(e){ console.warn('readState save failed (quota?):', e); }
}
function isRead(id){
  _loadReadState();
  const r=_reads.get(id);
  if(r===undefined) return false;
  const t=_tombs.get(id);
  return t===undefined || r>=t;
}
// Derived Set of currently-read ids (callers use .has()/iteration).
function getReadSet(){
  _loadReadState();
  const s=new Set();
  for(const id of _reads.keys()) if(isRead(id)) s.add(id);
  return s;
}
function markRead(id){
  _loadReadState();
  const ts=Date.now();
  if(ts>=(_reads.get(id)||0)) _reads.set(id,ts);
  _saveReadState();
  _pushReadState('add',id,ts);
}
function unmarkRead(id){
  _loadReadState();
  const ts=Date.now();
  if(ts>=(_tombs.get(id)||0)) _tombs.set(id,ts);
  _saveReadState();
  _pushReadState('remove',id,ts);
}
// Fire-and-forget POST (with the action's ts) to keep server in sync. Failures
// are logged, not retried — next syncReadState() reconciles via LWW.
function _pushReadState(action,id,ts){
  fetch('/api/read-state/'+action,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id,ts})
  }).catch(e=>console.warn('[read-state] '+action+' failed:',e));
}
// Initial sync: pull server reads+tombstones, merge per-id LWW both ways, push
// any locally-newer entries back. Called from init() after catalog is available.
async function syncReadState(){
  try{
    const r=await fetch('/api/read-state',{cache:'no-store'});
    if(!r.ok)return false;
    const data=await r.json();
    if(!data||!data.ok)return false;
    _loadReadState();
    const sr=data.reads||{}, st=data.tombstones||{};
    // server → local: pull when local is MISSING the entry (a read is a read
    // even at ts=0, e.g. legacy-migrated marks) or the server's ts is newer.
    // A bare `v > local` dropped ts=0 reads on a fresh device (0 > 0 = false),
    // which looked like a reset after switching origin (http:8765 → https:8766).
    for(const k in sr){ const v=Number(sr[k])||0; if(!_reads.has(k) || v>_reads.get(k)) _reads.set(k,v); }
    for(const k in st){ const v=Number(st[k])||0; if(!_tombs.has(k) || v>_tombs.get(k)) _tombs.set(k,v); }
    // local newer than server → push back (each with its own ts)
    const pushReads=[],pushTombs=[];
    // local → server: push when server is MISSING the entry or local ts is newer
    // (mirrors the pull side so a ts=0 read on a device also reaches the server).
    for(const [k,v] of _reads){ if(!(k in sr) || v>(Number(sr[k])||0)) pushReads.push(k); }
    for(const [k,v] of _tombs){ if(!(k in st) || v>(Number(st[k])||0)) pushTombs.push(k); }
    _saveReadState();
    pushReads.forEach(k=>_pushReadState('add',k,_reads.get(k)));
    pushTombs.forEach(k=>_pushReadState('remove',k,_tombs.get(k)));
    return true;
  }catch(e){console.warn('[read-state] sync failed:',e);return false;}
}
function toggleRead(id){
  if(isRead(id)){unmarkRead(id)}else{markRead(id)}
  updateReadUI(id);
}
// Drop ids that no longer exist in the catalog (renamed/deleted articles).
function pruneReadSet(catalog){
  if(!catalog||!catalog.articles)return;
  const valid = new Set(catalog.articles.map(a=>a.id));
  _loadReadState();
  let removed = 0;
  for(const id of [..._reads.keys()]){ if(!valid.has(id)){ _reads.delete(id); _tombs.delete(id); removed++; } }
  if(removed){ _saveReadState(); console.log('[read] pruned',removed,'orphan ids'); }
}
function updateReadUI(id){
  const rd=isRead(id);
  // Update sidebar item
  const ai=document.querySelector('.ai[data-id="'+CSS.escape(id)+'"]');
  if(ai){
    ai.classList.toggle('read',rd);
    let badge=ai.querySelector('.rd');
    if(rd&&!badge){badge=document.createElement('span');badge.className='rd';badge.textContent='\u2713';ai.appendChild(badge);}
    if(!rd&&badge)badge.remove();
  }
  // Update all read-toggle buttons in article
  document.querySelectorAll('.read-toggle').forEach(btn=>{
    btn.textContent=rd?'\u2713 \u5df2\u8bfb':'\u25cb \u6807\u8bb0\u5df2\u8bfb';
    btn.classList.toggle('is-read',rd);
  });
}

// ── Helpers ──────────────────────────────────────────
function h(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ha(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
// Sanitize Markdown-rendered HTML before injecting via innerHTML.
// DOMPurify defaults already allow <audio>/<video>/<source> and data-* attrs;
// we keep that surface and rely on it to strip event handlers, <script>, javascript: URLs, etc.
function safeHTML(html){
  if(typeof DOMPurify==='undefined')return html; // fallback (vendor not loaded)
  return DOMPurify.sanitize(html,{ALLOW_DATA_ATTR:true,ADD_ATTR:['target']});
}
function hsh(s){let v=0;for(let i=0;i<s.length;i++){v=((v<<5)-v)+s.charCodeAt(i);v|=0}return'h'+Math.abs(v)}

// ── Image fallback: _assets → same directory ────────
function imgFallback(img){
  const src=img.getAttribute('src')||'';
  // If currently trying _assets path, fall back to same-directory path
  if(src.includes('_assets/')||src.includes('_assets%2F')){
    const parts=src.split(/_assets[\/\/]|_assets%2[Ff]/);
    if(parts.length===2){
      // Rebuild: remove the _assets/basename_assets/ segment, keep the filename
      const dirPart=src.replace(/[^\/]+_assets[\/\/][^\/]*$/,'').replace(/[^\/]+_assets%2[Ff][^\/]*$/,'');
      // Get the directory before _assets folder
      const m=src.match(/^(.*\/vault\/.*\/)([^\/]+)_assets[\/\/](.+)$/)||src.match(/^(.*\/vault\/.*\/)([^\/]+)_assets%2[Ff](.+)$/);
      if(m){
        img.src=m[1]+m[3];
        return;
      }
    }
  }
  // Hide broken image
  img.style.display='none';
}

// ── Configure marked ─────────────────────────────────
marked.setOptions({ gfm:true, breaks:true, smartypants:false });

// ── Wiki link title → article id lookup ─────────────
let _wikiIndex=null;
function buildWikiIndex(){
  if(!C||_wikiIndex)return;
  _wikiIndex={};
  for(const a of C.articles){
    // map by filename without .md (case-insensitive)
    const fn=a.id.split('/').pop().replace(/\.md$/i,'');
    _wikiIndex[fn.toLowerCase()]=a.id;
    // also map by display title
    if(a.title)_wikiIndex[a.title.toLowerCase()]=a.id;
    // map without numeric prefix (e.g. "001 标题" → "标题")
    const noNum=fn.replace(/^\d+[_.\s-]*/,'');
    if(noNum&&noNum!==fn)_wikiIndex[noNum.toLowerCase()]=a.id;
    if(a.title){
      const tNoNum=a.title.replace(/^\d+[_.\s-]*/,'');
      if(tNoNum&&tNoNum!==a.title)_wikiIndex[tNoNum.toLowerCase()]=a.id;
    }
  }
}
function resolveWikiLink(name){
  if(!_wikiIndex)buildWikiIndex();
  if(!_wikiIndex)return null;
  const key=name.trim().toLowerCase();
  if(_wikiIndex[key])return _wikiIndex[key];
  // try with .md suffix stripped if present
  const k2=key.replace(/\.md$/,'');
  if(_wikiIndex[k2])return _wikiIndex[k2];
  // support path-style links: "课程/决策的54个基本/01-概率与期望值" → match article id
  // try appending .md and checking with common prefixes
  if(C){
    const withMd=key.endsWith('.md')?key:key+'.md';
    for(const a of C.articles){
      if(a.id.toLowerCase()===withMd||a.id.toLowerCase()==='wiki/'+withMd||a.id.toLowerCase()==='raw/'+withMd)return a.id;
    }
    // partial path match: if key contains '/', match end of article id
    if(key.includes('/')){
      for(const a of C.articles){
        const aid=a.id.toLowerCase();
        if(aid.endsWith('/'+withMd)||aid.endsWith('/'+k2+'.md'))return a.id;
      }
    }
  }
  return null;
}
// Convert [[wiki links]] in markdown text before marked parses it
function convertWikiLinks(md){
  // Protect checkbox syntax: [ ], [x], [X] — replace with placeholders before wiki link processing
  const _cbPlaceholders=[];
  md=md.replace(/^(\s*[-*+]\s+|\s*\d+\.\s+)?\[([ xX])\]/gm, function(match,prefix,check){
    const idx=_cbPlaceholders.length;
    const checked=check.toLowerCase()==='x';
    _cbPlaceholders.push({match,checked,prefix:prefix||''});
    return (prefix||'')+'%%CB_'+idx+'%%';
  });
  // First: convert ![[image]] embeds to standard markdown images
  md=md.replace(/!\[\[([^\]]+?)(?:\|([^\]]*?))?\]\]/g, function(_,target,alt){
    const t=target.trim();
    if(/\.(jpg|jpeg|png|gif|webp|svg|bmp)$/i.test(t)){
      // Encode path segments for marked compatibility (spaces/Chinese chars break parsing)
      const encoded=t.split('/').map(s=>encodeURIComponent(s)).join('/');
      return '!['+(alt||'').trim()+']('+encoded+')';
    }
    // Audio embed → <audio> player
    if(/\.(mp3|wav|ogg|m4a)$/i.test(t)){
      const encoded='/vault/'+t.split('/').map(s=>encodeURIComponent(s)).join('/');
      const label=(alt||t.split('/').pop().replace(/\.[^.]+$/,'')).trim();
      return '<div class="audio-embed" data-audio-path="'+ha(t)+'"><div class="audio-label">\ud83c\udfb5 '+h(label)+'</div><audio controls preload="metadata" src="'+ha(encoded)+'"></audio><div class="audio-embed-actions"><button class="audio-sub-btn" data-audio-src="'+ha(encoded)+'" data-audio-rel="'+ha(t)+'">\ud83d\udd24 字幕跟读</button></div></div>';
    }
    // Video embed → <video> player
    if(/\.(mp4|webm)$/i.test(t)){
      const encoded='/vault/'+t.split('/').map(s=>encodeURIComponent(s)).join('/');
      return '<div class="video-embed"><video controls preload="metadata" src="'+ha(encoded)+'"></video></div>';
    }
    // Non-media embed — treat as wiki link
    return '[['+target+(alt?'|'+alt:'')+']]';
  });
  // Then: convert [[wiki links]] to HTML
  md=md.replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g, function(_,target,alias){
    const display=alias||target;
    const aid=resolveWikiLink(target);
    if(aid){
      return '<a class="wl" href="javascript:void(0)" data-wl="'+ha(aid)+'">'+h(display)+'</a>';
    }
    return '<span class="wl wl-broken" title="未找到: '+ha(target)+'">'+h(display)+'</span>';
  });
  // Restore checkbox placeholders to proper HTML checkboxes
  md=md.replace(/%%CB_(\d+)%%/g, function(_,idx){
    const cb=_cbPlaceholders[parseInt(idx)];
    if(!cb)return _;
    return '<input type="checkbox" class="cb-toggle" data-cb-index="'+idx+'"'+(cb.checked?' checked':'')+' style="margin-right:6px;vertical-align:middle;cursor:pointer">';
  });
  return md;
}

// ── Strip frontmatter ────────────────────────────────
function stripFrontmatter(md){
  if(!md.startsWith('---'))return {meta:{},body:md};
  const m=md.slice(3).match(/\n---\s*\n/);
  if(!m)return {meta:{},body:md};
  const fmText=md.slice(3,3+m.index);
  const body=md.slice(3+m.index+m[0].length);
  const meta={};
  for(const line of fmText.split('\n')){
    const kv=line.match(/^(\w+)\s*:\s*(.+)/);
    if(kv)meta[kv[1]]=kv[2].replace(/^["']|["']$/g,'').trim();
  }
  return {meta,body};
}

// ── Auth ─────────────────────────────────────────────
async function checkAuth(){

    loginOverlay.style.display='none';

}

async function doLogin(){
  loginErr.textContent='';
  const pw=loginPw.value.trim();
  if(!pw){loginErr.textContent='请输入密码';return;}
  try{
    const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const d=await r.json();

}
loginBtn.addEventListener('click',doLogin);
loginPw.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

// ── Load catalog ─────────────────────────────────────
let inited=false;
let catalogEtag=localStorage.getItem('catalog-etag')||'';

function applyCatalog(data){
  C=data;
  _wikiIndex=null;
  pruneReadSet(C);
  renderSidebar(C,document.querySelector('.sf')?.value||'');
  restoreSidebarState();
  const ftSpan=sft.querySelector('span');
  ftSpan.textContent=C.totalArticles+' 篇 · '+C.categories.length+' 分类';
  ws.textContent='';
  const mk=(num,lbl)=>{const d=document.createElement('div');d.className='st';d.innerHTML='<span class="num"></span><span class="lbl"></span>';d.querySelector('.num').textContent=num;d.querySelector('.lbl').textContent=lbl;return d;};
  ws.appendChild(mk(C.totalArticles,'篇文章'));
  ws.appendChild(mk(C.categories.length,'个分类'));
}

async function fetchCatalog(){
  try{
    const headers={};
    if(catalogEtag)headers['If-None-Match']=catalogEtag;
    const r=await fetch('data/catalog.json',{headers});
    if(r.status===304){console.log('[catalog] 304 not modified');return null;}
    const etag=r.headers.get('etag')||'';
    const data=await r.json();
    if(etag){
      try{
        // Trim cache: only keep fields needed to render sidebar + render article shell.
        // Avoids 5MB localStorage quota issues when catalog grows.
        const slim={categories:data.categories,totalArticles:data.totalArticles,
          articles:data.articles.map(a=>({id:a.id,title:a.title,category:a.category,subcategory:a.subcategory,meta:a.meta}))};
        const s=JSON.stringify(slim);
        if(s.length<2*1024*1024){
          localStorage.setItem('catalog-cache',s);
          localStorage.setItem('catalog-etag',etag);
          catalogEtag=etag;
        }else{
          console.warn('[catalog] cache skip: payload',s.length,'> 2MB');
          localStorage.removeItem('catalog-cache');
        }
      }catch(e){console.warn('[catalog] cache write failed:',e);}
    }
    return data;
  }catch(e){console.error('[catalog] fetch failed',e);return null;}
}

function refreshCatalog(){
  fetchCatalog().then(data=>{if(data){applyCatalog(data);console.log('[live] catalog refreshed, '+data.totalArticles+' articles');}});
}

async function init(){
  if(inited)return;inited=true;
  // Pull server-side read state in parallel with catalog (cross-device sync).
  const readSyncP=syncReadState();
  try{
    // 1. Instant render from localStorage cache
    const cached=localStorage.getItem('catalog-cache');
    if(cached){
      try{applyCatalog(JSON.parse(cached));console.log('[catalog] rendered from cache');}catch(e){localStorage.removeItem('catalog-cache');localStorage.removeItem('catalog-etag');}
    }
    // 2. Fetch latest (ETag — 304 if unchanged)
    const data=await fetchCatalog();
    if(data){applyCatalog(data);console.log('[catalog] updated from server, '+data.totalArticles+' articles');}
    else if(!cached){snav.innerHTML='<div class="ld">加载失败</div>';return;}
    // 3. After server read-state sync resolves, re-render sidebar so newly-pulled marks show.
    if(await readSyncP && C){
      renderSidebar(C,document.querySelector('.sf')?.value||'');
      restoreSidebarState();
      // Also refresh any read-toggle button currently on screen.
      if(curId)updateReadUI(curId);
    }
    // Load article from hash (supports deep link "#id?highlight=...")
    const rawHash=location.hash.slice(1);
    if(rawHash){
      const qi=rawHash.indexOf('?');
      const idPart=qi>=0?rawHash.slice(0,qi):rawHash;
      let hl='';
      if(qi>=0){ try{ hl=decodeURIComponent(new URLSearchParams(rawHash.slice(qi+1)).get('highlight')||''); }catch(e){} }
      if(idPart)loadArticle(decodeURIComponent(idPart), hl);
    }
    // SSE: live catalog updates. Do NOT close() on error — EventSource
    // auto-reconnects; closing it (even after a successful reconnect) would
    // permanently kill live updates until a page reload.
    if(typeof EventSource!=='undefined'){
      const es=new EventSource('/api/events');
      es.onmessage=function(e){
        if(e.data==='catalog-updated') refreshCatalog();
      };
      es.onerror=function(){ /* leave it to the browser's built-in reconnect */ };
    }
  }catch(e){snav.innerHTML='<div class="ld">加载失败</div>';console.error(e)}
}

// ── Render sidebar ───────────────────────────────────
function renderSidebar(cat,filter){
  const fl=(filter||'').toLowerCase();
  const readSet=getReadSet();
  let out='';
  const sections={'\ud83d\udcc2 Raw':[],'\ud83d\udcda Wiki':[]};
  for(const a of cat.articles){
    if(fl&&!a.title.toLowerCase().includes(fl))continue;
    sections[a.category]=sections[a.category]||[];
    sections[a.category].push(a);
  }

  // Build a tree from subcategory paths (supports arbitrary depth)
  function buildTree(articles){
    const root={children:{},articles:[]};
    for(const a of articles){
      if(!a.subcategory){root.articles.push(a);continue;}
      const parts=a.subcategory.split('/');
      let node=root;
      for(const p of parts){
        if(!node.children[p])node.children[p]={children:{},articles:[]};
        node=node.children[p];
      }
      node.articles.push(a);
    }
    return root;
  }

  // Count all articles in a tree node (recursive)
  function countAll(node){
    let n=node.articles.length;
    for(const k of Object.keys(node.children))n+=countAll(node.children[k]);
    return n;
  }

  // Render tree recursively
  function renderTree(node,prefix,depth){
    let html='';
    const padLeft=26+depth*12;
    const artPadLeft=padLeft+8;
    const fontSize=depth>0?'11':'12';
    // Render articles at this level
    for(const a of node.articles){
      const act=a.id===curId?' active':'';
      const rd=readSet.has(a.id);
      html+='<div class="ai'+(rd?' read':'')+act+'" style="padding-left:'+artPadLeft+'px" data-id="'+ha(a.id)+'" title="'+ha(a.title)+'">';
      html+='<span class="at">'+h(a.title)+'</span>';
      if(rd)html+='<span class="rd">\u2713</span>';
      html+='</div>';
    }
    // Render child directories sorted
    const childKeys=Object.keys(node.children).sort();
    for(const ck of childKeys){
      const child=node.children[ck];
      const total=countAll(child);
      const id=hsh(prefix+'/'+ck);
      const isOpen=!!fl;
      html+='<div class="sh'+(isOpen?' open':'')+'" data-t="'+id+'" style="padding-left:'+padLeft+'px;font-size:'+fontSize+'px">';
      html+='<span class="arr">\u25b6</span>'+h(ck)+' <span style="color:var(--text-3);font-weight:400">('+total+')</span></div>';
      html+='<div class="si-items'+(isOpen?' open':'')+'" id="'+id+'">';
      html+=renderTree(child,prefix+'/'+ck,depth+1);
      html+='</div>';
    }
    return html;
  }

  const secOrder=['\ud83d\udcc2 Raw','\ud83d\udcda Wiki'];
  for(const sec of secOrder){
    const arts=sections[sec];if(!arts||!arts.length)continue;
    const secId=hsh(sec);
    out+='<div class="cg"><div class="ch open" data-t="'+secId+'"><span><span class="arr">\u25b6</span>'+h(sec)+'</span><span class="cnt">'+arts.length+'</span></div><div class="ci open" id="'+secId+'">';
    const tree=buildTree(arts);
    out+=renderTree(tree,sec,0);
    out+='</div></div>';
  }
  if(!out)out='<div class="ld">\u65e0\u5339\u914d\u7ed3\u679c</div>';
  snav.innerHTML=out;
}


// ── Get prev/next articles in same category ─────────
function getNavSiblings(id){
  if(!C||!C.articles)return{prev:null,next:null};
  const cur=C.articles.find(a=>a.id===id);
  if(!cur)return{prev:null,next:null};
  const sameCat=C.articles.filter(a=>a.category===cur.category);
  const idx=sameCat.findIndex(a=>a.id===id);
  return{
    prev:idx>0?sameCat[idx-1]:null,
    next:idx<sameCat.length-1?sameCat[idx+1]:null
  };
}

// ── Expand sidebar to a specific category/subcategory ──
function expandSidebarTo(key,type){
  // On mobile, open sidebar first
  if(window.innerWidth<=1024) openSide();
  // For category: key is the category name like '📂 Raw', toggle its .ch
  // For sub: key is like '📂 Raw/课程/决策的54个基本'
  const targetId=hsh(key);
  const targetEl=document.getElementById(targetId);
  if(!targetEl)return;
  // Ensure all ancestors are open
  // Walk up from the key, opening each parent
  if(type==='sub'){
    const parts=key.split('/');
    // parts[0] is the category, rest are subcategory levels
    // Open category first
    const catId=hsh(parts[0]);
    const catContainer=document.getElementById(catId);
    const catHeader=document.querySelector('.ch[data-t="'+catId+'"]');
    if(catContainer&&!catContainer.classList.contains('open')){
      catContainer.classList.add('open');
      if(catHeader)catHeader.classList.add('open');
    }
    // Open each subcategory level
    for(let i=1;i<parts.length;i++){
      const subKey=parts.slice(0,i+1).join('/');
      const subId=hsh(subKey);
      const subContainer=document.getElementById(subId);
      const subHeader=document.querySelector('.sh[data-t="'+subId+'"]');
      if(subContainer&&!subContainer.classList.contains('open')){
        subContainer.classList.add('open');
        if(subHeader)subHeader.classList.add('open');
      }
    }
  }else{
    // Category: just open it
    const catHeader=document.querySelector('.ch[data-t="'+targetId+'"]');
    if(!targetEl.classList.contains('open')){
      targetEl.classList.add('open');
      if(catHeader)catHeader.classList.add('open');
    }
  }
  // Scroll sidebar to show the target
  const header=document.querySelector('.sh[data-t="'+targetId+'"]')||document.querySelector('.ch[data-t="'+targetId+'"]');
  if(header)header.scrollIntoView({behavior:'smooth',block:'center'});
  saveSidebarState();
}

// ── Toggle checkbox in reading mode ─────────────────────
// Serialize writes: each toggle is GET→modify Nth box→POST. Two concurrent
// toggles would both read the same original and the later POST would clobber
// the earlier one (lost update). Chain them so each GET sees the prior write.
let _cbWriteChain=Promise.resolve();
function toggleCheckbox(articleId,cbIndex,newChecked){
  const run=_cbWriteChain.then(()=>_doToggleCheckbox(articleId,cbIndex,newChecked));
  _cbWriteChain=run.catch(()=>{});
  return run;
}
async function _doToggleCheckbox(articleId,cbIndex,newChecked){
  try{
    const r=await fetch('/vault/'+articleId.split('/').map(s=>encodeURIComponent(s)).join('/'),{cache:'no-store'});
    if(!r.ok)throw new Error('fetch failed');
    let md=await r.text();
    let matchCount=0;
    md=md.replace(/^(\s*[-*+]\s+|\s*\d+\.\s+)?\[([ xX])\]/gm,function(match,prefix,check){
      if(matchCount++===cbIndex){
        const newMark=newChecked?'x':' ';
        return (prefix||'')+'['+newMark+']';
      }
      return match;
    });
    const sr=await fetch('/vault/'+articleId.split('/').map(s=>encodeURIComponent(s)).join('/'),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({content:md})
    });
    const d=await sr.json();
    if(!d.ok)throw new Error(d.error||'save failed');
  }catch(e){
    const el=ct.querySelector('input.cb-toggle[data-cb-index="'+cbIndex+'"]');
    if(el)el.checked=!newChecked;
    console.error('Checkbox toggle failed:',e);
  }
}

// ── Load article (fetch raw markdown, render in browser) ─
async function loadArticle(id, highlightText){
  if(typeof TTS!=='undefined'){TTS.stop();TTS.audio=null;TTS.cues=[];TTS.segments=[];TTS.segMap=[];TTS._segTimeRanges=null;TTS._hlEl=null;}
  if(typeof InlineAudio!=='undefined'){for(const k of InlineAudio.active.keys())InlineAudio.deactivate(k);}
  ct.innerHTML='<div class="ld"><div class="sp"></div><div>加载中...</div></div>';
  try{
    const r=await fetch('/vault/'+id.split('/').map(s=>encodeURIComponent(s)).join('/'),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const mdText=await r.text();
    const {meta,body}=stripFrontmatter(mdText);
    const artInfo=C?C.articles.find(a=>a.id===id):null;
    const title=artInfo?artInfo.title:(meta.title||id.split('/').pop().replace('.md',''));
    // Drop a leading "# <title>" that merely repeats the title the header already
    // shows (common in reports that open with their own H1) — avoids a double title.
    let docBody=body;
    const _leadH1=docBody.match(/^﻿?[\r\n]*#[ \t]+(.+?)[ \t]*#*[ \t]*(?:\r?\n|$)/);
    if(_leadH1&&_leadH1[1].trim()===String(title).trim())docBody=docBody.slice(_leadH1[0].length);
    const catName=artInfo?artInfo.category:'';
    curId=id;
    editMode=false;
    location.hash=encodeURIComponent(id);
    // Build clickable breadcrumb
    bc.innerHTML='';
    const bcParts=[];
    if(catName)bcParts.push({label:catName,type:'cat',key:catName});
    if(artInfo&&artInfo.subcategory){
      const subParts=artInfo.subcategory.split('/');
      let subPath=catName;
      for(const sp of subParts){
        subPath+='/'+sp;
        bcParts.push({label:sp,type:'sub',key:subPath});
      }
    }
    bcParts.push({label:title,type:'leaf'});
    bcParts.forEach((p,i)=>{
      if(i>0){
        const sep=document.createElement('span');
        sep.className='bc-sep';
        sep.textContent='›';
        bc.appendChild(sep);
      }
      const span=document.createElement('span');
      if(p.type==='leaf'){
        span.className='bc-leaf';
        span.textContent=p.label;
      }else{
        span.className='bc-seg';
        span.textContent=p.label;
        span.addEventListener('click',()=>expandSidebarTo(p.key,p.type));
      }
      bc.appendChild(span);
    });
    // Show edit button for .md files
    if(typeof editToggle!=='undefined'){
      editToggle.style.display=id.toLowerCase().endsWith('.md')?'':'none';
      editToggle.textContent='📝';
      editToggle.title='编辑';
      editToggle.classList.remove('active');
    }
    let metaHtml='';
    const am=artInfo?artInfo.meta:meta;
    if(am.author)metaHtml+='<span class="author">'+h(String(am.author))+'</span>';
    if(am.progress)metaHtml+='<span>进度 '+h(String(am.progress))+'</span>';
    const tags=am.tags;
    if(tags&&Array.isArray(tags))for(const t of tags)metaHtml+='<span class="tag">'+h(String(t))+'</span>';
    const wikiBody=convertWikiLinks(docBody);
    // Resolve relative image paths to vault directory (with _assets fallback)
    const artDir='/vault/'+id.replace(/\/[^\/]+$/,'').split('/').map(s=>encodeURIComponent(s)).join('/')+'/';
    const artBasename=id.split('/').pop().replace(/\.md$/i,'');
    const renderer=new marked.Renderer();
    renderer.image=function({href,title,text}){
      let src=href||'';
      // Only transform relative paths (not absolute URLs or /vault/ paths)
      if(src&&!src.startsWith('http')&&!src.startsWith('/')){
        // href is already percent-encoded by convertWikiLinks, just prepend /vault/
        src='/vault/'+src;
      }
      const alt=text||'';
      const t=title?' title="'+ha(title)+'"':'';
      return '<img src="'+src+'" alt="'+ha(alt)+'"'+t+' loading="lazy">';
    };
    renderer.link=function({href,title,text}){
      const url=href||'';
      const t=title?' title="'+ha(title)+'"':'';
      // External links (http/https) open in new tab
      if(url.match(/^https?:\/\//i)){
        return '<a href="'+ha(url)+'"'+t+' target="_blank" rel="noopener noreferrer">'+text+'</a>';
      }
      return '<a href="'+ha(url)+'"'+t+'>'+text+'</a>';
    };
    const htmlContent=marked.parse(wikiBody,{renderer});
    const rd=isRead(id);
    const rdLabel=rd?'\u2713 \u5df2\u8bfb':'\u25cb \u6807\u8bb0\u5df2\u8bfb';
    const rdCls='read-toggle'+(rd?' is-read':'');
    const rdBtn='<button class="'+rdCls+'">'+rdLabel+'</button>';
    // Build prev/next nav buttons
    const nav=getNavSiblings(id);
    let navHtml='';
    if(nav.prev)navHtml+='<button class="nav-btn" data-nav="'+ha(nav.prev.id)+'">⏮ '+h(nav.prev.title)+'</button>';
    if(nav.next)navHtml+='<button class="nav-btn" data-nav="'+ha(nav.next.id)+'">'+h(nav.next.title)+' ⏭</button>';
    ct.innerHTML='<div class="article"><div class="art-hd"><h1>'+h(title)+'</h1>'+(metaHtml?'<div class="art-meta">'+metaHtml+'</div>':'')+'<div class="art-actions">'+rdBtn+'</div></div><div class="art-body">'+safeHTML(htmlContent)+'</div><div class="art-ft">'+rdBtn+navHtml+'</div></div>';
    ct.scrollTop=0;
    // Wrap each table so wide ones scroll horizontally instead of breaking the layout.
    ct.querySelectorAll('.art-body table').forEach(t=>{
      if(t.parentElement&&t.parentElement.classList.contains('md-table-wrap'))return;
      const w=document.createElement('div');w.className='md-table-wrap';
      t.parentNode.insertBefore(w,t);w.appendChild(t);
    });
    // ── Citation cross-refs: <sup>a3,b5</sup> → clickable, jumps to the source row ──
    (function(){
      const bodyEl=ct.querySelector('.art-body'); if(!bodyEl)return;
      const ids=new Set();
      bodyEl.querySelectorAll('table').forEach(tbl=>{
        const tb=tbl.tBodies[0]; if(!tb)return;
        const head=tbl.tHead&&tbl.tHead.rows[0];
        let isCite=!!head&&/角标|编号|来源|脚注/.test((head.cells[0]&&head.cells[0].textContent)||'');
        if(!isCite){const rs=[...tb.rows];const hit=rs.filter(r=>/^[a-z]+\d+$/i.test(((r.cells[0]||{}).textContent||'').trim())).length;isCite=rs.length>0&&hit/rs.length>=0.6;}
        if(!isCite)return;
        [...tb.rows].forEach(r=>{const k=((r.cells[0]||{}).textContent||'').trim().toLowerCase();if(/^[a-z]+\d+$/.test(k)){r.id='cite-'+k;r.classList.add('cite-row');ids.add(k);}});
      });
      if(!ids.size)return;
      const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
      bodyEl.querySelectorAll('sup').forEach(sup=>{
        if(sup.closest('.cite-row'))return;
        const txt=sup.textContent||'';
        if(!/[a-z]\d/i.test(txt))return;
        sup.innerHTML=esc(txt).replace(/([a-z]+\d+)/gi,m=>ids.has(m.toLowerCase())?'<a class="cref" data-c="'+m.toLowerCase()+'">'+m+'</a>':m);
      });
      bodyEl.querySelectorAll('a.cref').forEach(a=>a.addEventListener('click',function(e){
        e.preventDefault();
        const row=bodyEl.querySelector('#cite-'+CSS.escape(this.dataset.c));
        if(!row)return;
        row.scrollIntoView({behavior:'smooth',block:'center'});
        row.classList.remove('cite-flash');void row.offsetWidth;row.classList.add('cite-flash');
      }));
    })();
    // Bind read-toggle buttons
    ct.querySelectorAll('.read-toggle').forEach(btn=>btn.addEventListener('click',()=>toggleRead(id)));
    // Bind prev/next nav buttons
    ct.querySelectorAll('.nav-btn[data-nav]').forEach(btn=>btn.addEventListener('click',function(){loadArticle(this.dataset.nav)}));
    // Bind wiki links
    ct.querySelectorAll('a.wl[data-wl]').forEach(a=>a.addEventListener('click',function(e){
      e.preventDefault();
      const targetId=this.dataset.wl;
      // Check if this wiki link is from a 笔记.md source line (—— [[title]])
      // Try to find the associated quote from a preceding blockquote
      const quoteText=findQuoteForWikiLink(this);
      if(quoteText){
        // Pass the highlight as an arg — routing it through location.hash used
        // to fail because loadArticle() overwrites the hash with the bare id
        // before reading the ?highlight= back out.
        loadArticle(targetId, quoteText.slice(0,40));
      }else{
        loadArticle(targetId);
      }
    }));
    // Bind checkbox toggles (reading mode)
    ct.querySelectorAll('input.cb-toggle[data-cb-index]').forEach(cb=>{
      cb.addEventListener('change',async function(){
        if(!curId)return;
        const checked=this.checked;
        const cbIdx=parseInt(this.dataset.cbIndex);
        await toggleCheckbox(curId,cbIdx,checked);
      });
    });
    // Update sidebar active
    document.querySelectorAll('.ai.active').forEach(el=>el.classList.remove('active'));
    const el=document.querySelector('.ai[data-id="'+CSS.escape(id)+'"]');
    if(el){
      el.classList.add('active');
      el.scrollIntoView({block:'nearest'});
    }
    // Load annotations (highlights + notes from 笔记.md)
    loadAnnotations(id);
    // Highlight jump: prefer the explicit arg (wiki-link nav / deep link);
    // fall back to parsing the hash for any "#id?highlight=..." still present.
    let hl=highlightText||'';
    if(!hl){
      const hashParts=location.hash.split('?');
      if(hashParts.length>1){
        try{ hl=decodeURIComponent(new URLSearchParams(hashParts.slice(1).join('?')).get('highlight')||''); }catch(e){}
      }
    }
    if(hl){ setTimeout(()=>scrollToHighlight(hl),500); }
    closeSide();
  }catch(e){
    ct.innerHTML='<div class="ld">文章加载失败</div>';
    console.error(e);
  }
}

function saveSidebarState(){
  const opened=[];
  snav.querySelectorAll('.ch.open,.sh.open').forEach(el=>{
    if(el.dataset.t)opened.push(el.dataset.t);
  });
  try{localStorage.setItem('sidebar-open',JSON.stringify(opened))}catch(e){}
}
function restoreSidebarState(){
  try{
    const saved=JSON.parse(localStorage.getItem('sidebar-open')||'[]');
    if(!saved.length)return;
    const openSet=new Set(saved);
    snav.querySelectorAll('.ch,.sh').forEach(el=>{
      if(el.dataset.t&&openSet.has(el.dataset.t)){
        el.classList.add('open');
        const t=document.getElementById(el.dataset.t);
        if(t)t.classList.add('open');
      }else if(el.dataset.t&&!openSet.has(el.dataset.t)){
        el.classList.remove('open');
        const t=document.getElementById(el.dataset.t);
        if(t)t.classList.remove('open');
      }
    });
  }catch(e){}
}

// Swipe gestures for sidebar (touch devices only).
// - Edge-swipe right from the left ~20px → openSide
// - Swipe left on an open sidebar → closeSide
(function(){
  const EDGE_PX=24;       // start zone for opening
  const MIN_DX=60;        // minimum horizontal distance
  const MAX_DY_RATIO=0.6; // |dy|/|dx| must be small (mostly horizontal)
  const MAX_DURATION=600;
  let sx=0,sy=0,st=0,tracking=false,fromEdge=false,fromSide=false;
  function onStart(e){
    if(window.innerWidth>1024)return;
    if(!e.touches||e.touches.length!==1)return;
    const t=e.touches[0];
    sx=t.clientX;sy=t.clientY;st=Date.now();
    fromEdge=(sx<=EDGE_PX&&!side.classList.contains('open'));
    fromSide=side.classList.contains('open');
    tracking=fromEdge||fromSide;
  }
  function onEnd(e){
    if(!tracking)return;
    tracking=false;
    const t=(e.changedTouches&&e.changedTouches[0])||null;
    if(!t)return;
    const dx=t.clientX-sx,dy=t.clientY-sy,dur=Date.now()-st;
    if(dur>MAX_DURATION)return;
    if(Math.abs(dy)>Math.abs(dx)*MAX_DY_RATIO)return;
    if(fromEdge&&dx>MIN_DX)openSide();
    else if(fromSide&&dx<-MIN_DX)closeSide();
  }
  document.addEventListener('touchstart',onStart,{passive:true});
  document.addEventListener('touchend',onEnd,{passive:true});
  document.addEventListener('touchcancel',()=>{tracking=false},{passive:true});
})();

// ── 注释标注系统（划线 + 笔记 显示在原文中）─────
const annTooltip=$('annTooltip');
let _annTooltipTimer=null;

// Load annotations for current article and highlight in .art-body
async function loadAnnotations(articleId){
  if(!articleId)return;
  // Clear existing annotations
  const body=document.querySelector('.art-body');
  if(!body)return;
  // Remove old marks
  body.querySelectorAll('mark.ann-hl,mark.ann-note').forEach(m=>{
    const parent=m.parentNode;
    while(m.firstChild)parent.insertBefore(m.firstChild,m);
    parent.removeChild(m);
    parent.normalize();
  });
  try{
    const r=await fetch('/api/notes?articleId='+encodeURIComponent(articleId));
    if(!r.ok)return;
    const d=await r.json();
    if(!d.ok||!d.notes||!d.notes.length)return;
    // For each note entry, find and wrap matching text
    for(const entry of d.notes){
      highlightInBody(body,entry);
    }
  }catch(e){
    console.error('[annotations] load failed:',e);
  }
}

function highlightInBody(body,entry){
  const quote=entry.quote.trim();
  if(!quote)return;
  const hasNote=!!entry.note;
  // Walk text nodes to find the quote
  const tw=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,null);
  // Build full text and track node positions
  const textNodes=[];
  const textParts=[];
  let fullText='';
  while(tw.nextNode()){
    const node=tw.currentNode;
    // Skip nodes inside existing marks
    if(node.parentElement&&node.parentElement.closest('mark.ann-hl,mark.ann-note'))continue;
    textNodes.push(node);
    textParts.push({node,start:fullText.length,end:fullText.length+node.textContent.length});
    fullText+=node.textContent;
  }
  // Find quote in fullText: exact first, then whitespace-normalized but with an
  // index map back to the ORIGINAL string. (The old code reused the collapsed
  // offset directly, mis-positioning the mark whenever the original had runs of
  // whitespace before the match.)
  let matchStart=fullText.indexOf(quote);
  let matchEnd=matchStart>=0?matchStart+quote.length:-1;
  if(matchStart<0){
    let normFull='';const map=[];let prevSpace=false;
    for(let i=0;i<fullText.length;i++){
      const ch=fullText[i];
      if(/\s/.test(ch)){ if(prevSpace)continue; normFull+=' ';map.push(i);prevSpace=true; }
      else{ normFull+=ch;map.push(i);prevSpace=false; }
    }
    const normQuote=quote.replace(/\s+/g,' ').trim();
    const normPos=normQuote?normFull.indexOf(normQuote):-1;
    if(normPos>=0){
      matchStart=map[normPos];
      const lastIdx=normPos+normQuote.length-1;
      matchEnd=(map[lastIdx]!==undefined?map[lastIdx]:fullText.length-1)+1;
    }
  }
  if(matchStart<0)return;
  // Find which text nodes are involved
  const affectedNodes=[];
  for(const tp of textParts){
    if(tp.end<=matchStart)continue;
    if(tp.start>=matchEnd)break;
    affectedNodes.push({
      node:tp.node,
      nodeStart:tp.start,
      hlStart:Math.max(matchStart,tp.start)-tp.start,
      hlEnd:Math.min(matchEnd,tp.end)-tp.start
    });
  }
  // Wrap each affected text node's portion in <mark>
  const cls=hasNote?'ann-note':'ann-hl';
  const tooltipData=encodeURIComponent(JSON.stringify({quote:entry.quote||'',note:entry.note||'',date:entry.date||''}));
  for(const an of affectedNodes){
    const node=an.node;
    const text=node.textContent;
    const before=text.slice(0,an.hlStart);
    const matched=text.slice(an.hlStart,an.hlEnd);
    const after=text.slice(an.hlEnd);
    const parent=node.parentNode;
    const frag=document.createDocumentFragment();
    if(before)frag.appendChild(document.createTextNode(before));
    const mark=document.createElement('mark');
    mark.className=cls;
    mark.setAttribute('data-ann',tooltipData);
    mark.textContent=matched;
    frag.appendChild(mark);
    if(after)frag.appendChild(document.createTextNode(after));
    parent.replaceChild(frag,node);
  }
}
