// Find quote text associated with a wiki link in 笔记.md
function findQuoteForWikiLink(linkEl){
  let node=linkEl.closest('p,em,strong,h2');
  if(!node)node=linkEl.parentElement;
  const parentText=(node?node.textContent:'');

  // New format: wiki link is inside ## [[title]] heading
  // In this case, clicking the heading link should navigate to the article (no specific quote)
  if(node&&node.tagName==='H2'){
    return null; // heading-level link — just navigate to the article, no quote highlight
  }

  // Old format: *—— [[title]]，date* source line
  if(!parentText.includes('——'))return null;
  // Walk backwards from this element to find the nearest blockquote
  let prev=node;
  let limit=10;
  while(prev&&limit-->0){
    prev=prev.previousElementSibling;
    if(!prev)break;
    if(prev.tagName==='BLOCKQUOTE'){
      return prev.textContent.trim();
    }
    // Skip <p> tags that might be note content
    if(prev.tagName==='HR')break; // went too far back
  }
  return null;
}

// ── 滚动元素到内容区上方 1/3 处 ─────
function scrollElIntoView(el){
  const ctRect=ct.getBoundingClientRect();
  const elRect=el.getBoundingClientRect();
  const offset=elRect.top-ctRect.top+ct.scrollTop;
  const target=offset-ct.clientHeight*0.25;
  ct.scrollTo({top:Math.max(0,target),behavior:'smooth'});
}

// ── 从笔记.md 链接跳转到文字位置 ─────
function scrollToHighlight(searchText){
  if(!searchText)return;
  const body=document.querySelector('.art-body');
  if(!body)return;
  // First try to find in existing annotation marks
  const marks=body.querySelectorAll('mark.ann-hl,mark.ann-note');
  for(const m of marks){
    if(m.textContent.includes(searchText.slice(0,15))){
      scrollElIntoView(m);
      m.classList.add('ann-flash');
      setTimeout(()=>m.classList.remove('ann-flash'),3000);
      return;
    }
  }
  // Fallback: search in full text
  const tw=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,null);
  while(tw.nextNode()){
    const node=tw.currentNode;
    const idx=node.textContent.indexOf(searchText.slice(0,20));
    if(idx>=0){
      // Wrap the found text in a temporary highlight
      const range=document.createRange();
      range.setStart(node,idx);
      range.setEnd(node,Math.min(idx+searchText.length,node.textContent.length));
      const mark=document.createElement('mark');
      mark.className='ann-hl ann-flash';
      range.surroundContents(mark);
      scrollElIntoView(mark);
      setTimeout(()=>{
        mark.classList.remove('ann-flash');
      },3000);
      return;
    }
  }
}

// ── TTS 听书（Edge TTS）─────────────────────────────────
const ttsToggle=$('ttsToggle'),ttsBar=$('ttsBar');
const ttsPlay=$('ttsPlay'),ttsStop=$('ttsStop');
const ttsProgress=$('ttsProgress'),ttsProgressFill=$('ttsProgressFill');
const ttsInfo=$('ttsInfo'),ttsSpeedSel=$('ttsSpeed');

// Single source of truth for splitting the rendered article into segments.
// Used by BOTH whole-article TTS and inline-audio follow-along, and mirrored by
// align.py's parse_segments — if these drift, the alignment count won't match
// the DOM and the frontend silently falls back to LCS. Rules: skip .audio-embed
// (UI chrome, not article text) and skip <p> directly inside <li> (marked's
// loose-list rendering would otherwise duplicate the item's text).
function collectArticleSegments(){
  const out=[];
  const body=document.querySelector('.art-body');
  if(!body)return out;
  const blocks=body.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li, blockquote > p, td, th');
  const seen=new Set();
  for(const el of blocks){
    if(seen.has(el))continue;
    seen.add(el);
    if(el.closest('.audio-embed'))continue;
    if(el.tagName==='P'&&el.parentElement&&el.parentElement.tagName==='LI')continue;
    const text=el.innerText.trim();
    if(text.length<1)continue;
    out.push({el,text});
  }
  return out;
}

const TTS={
  debug: new URLSearchParams(location.search).has('debug'),
  audio: null,
  cues: [],           // {start, end, text} from WebVTT
  segments: [],       // {el, text} DOM segments for highlight
  segMap: [],         // cue index → segment index mapping
  playing: false,
  paused: false,
  speed: 1.0,
  speeds: [0.6, 0.8, 1.0, 1.2, 1.5, 1.8, 2.0],
  barVisible: false,
  generating: false,
  curCueIdx: -1,

  // Extract plain text from article body for TTS
  getArticleText(){
    const body=document.querySelector('.art-body');
    if(!body)return '';
    return body.innerText.trim();
  },

  // Find the segment index that contains the given text (or closest match)
  findSegmentByText(searchText){
    if(!this.segments.length)return -1;
    const norm=s=>s.replace(/[\s\u3000]/g,'').toLowerCase();
    const needle=norm(searchText).slice(0,50); // use first 50 chars for matching
    if(!needle)return -1;
    // Try exact substring match first
    for(let i=0;i<this.segments.length;i++){
      if(norm(this.segments[i].text).includes(needle))return i;
    }
    // Fallback: find best overlap
    let bestIdx=0,bestScore=0;
    for(let i=0;i<this.segments.length;i++){
      const segNorm=norm(this.segments[i].text);
      // Count matching chars from needle start
      let score=0;
      for(let j=0;j<needle.length&&j<segNorm.length;j++){
        if(segNorm.includes(needle.slice(0,j+1)))score=j+1;
        else break;
      }
      if(score>bestScore){bestScore=score;bestIdx=i;}
    }
    return bestIdx;
  },

  // Play from a specific segment (by selected text)
  async playFromText(searchText){
    console.log('[tts] playFromText called, text:', searchText.slice(0,30));
    // Show TTS bar if not visible
    if(!this.barVisible){
      this.barVisible=true;
      ttsBar.classList.add('on');
      ttsToggle.classList.add('active');
    }
    // If audio already loaded and segments mapped, seek directly
    if(this.audio&&this.audio.src&&this._segTimeRanges&&this._segTimeRanges.length){
      // Rebuild segments if empty (can happen after DOM re-render)
      if(!this.segments.length) this.buildSegments();
      const sIdx=this.findSegmentByText(searchText);
      console.log('[tts] direct seek: segIdx=',sIdx,'segTimeRanges.length=',this._segTimeRanges.length);
      if(sIdx>=0&&this._segTimeRanges[sIdx]){
        const seekTime=this._segTimeRanges[sIdx].start;
        console.log('[tts] seeking to',seekTime,'s for segment',sIdx);
        this.audio.currentTime=seekTime;
        this.audio.playbackRate=this.speed;
        this.playing=true;
        this.paused=false;
        this.audio.play().catch(e=>this._onPlayFail(e));
        this.updateUI();
        return;
      }
    }
    // Need to generate first, then seek after generation
    console.log('[tts] no audio loaded, will generate then seek');
    this._pendingSeekText=searchText;
    await this.play();
  },

  // Build DOM segments for highlight mapping
  buildSegments(){
    // Shared with inline-audio + align.py (see collectArticleSegments).
    this.segments=collectArticleSegments();
  },

  // Build segment time ranges by aligning VTT cue text to DOM segment text
  // Each cue has precise timestamps from edge-tts. We assign each cue to a segment,
  // then derive each segment's time range from its first/last cue.
  buildSegMap(){
    this.segMap=[];
    this._segTimeRanges=[];
    if(!this.cues.length||!this.segments.length){return;}
    const DBG=this.debug;
    const dbgLog=[];  // per-cue debug entries for TTS alignment
    // Normalize: remove punctuation, whitespace, numbers; lowercase
    const norm=s=>s.replace(/[\s\u3000.,;:!?\-\u2026\u201c\u201d\u2018\u2019\uff0c\u3002\uff01\uff1f\u3001\uff1b\uff1a\u300a\u300b\u3010\u3011()\[\]#\uff08\uff09\u2014\u2013\u200b]/g,'').replace(/\d+/g,'').toLowerCase();
    // Character-level similarity with insertion/deletion tolerance
    const charSim=(a,b)=>{
      if(!a||!b)return 0;
      const mx=Math.max(a.length,b.length);
      if(!mx)return 0;
      let matches=0,ai=0,bi=0;
      while(ai<a.length&&bi<b.length){
        if(a[ai]===b[bi]){matches++;ai++;bi++;}
        else if(ai+1<a.length&&a[ai+1]===b[bi])ai++;
        else if(bi+1<b.length&&a[ai]===b[bi+1])bi++;
        else{ai++;bi++;}
      }
      return matches/mx;
    };
    // Build concatenated normalized segment text
    const segRanges=[];
    let segFullNorm='';
    for(let i=0;i<this.segments.length;i++){
      const n=norm(this.segments[i].text);
      segRanges.push({start:segFullNorm.length,end:segFullNorm.length+n.length});
      segFullNorm+=n;
    }
    // Determine spoken range: exclude trailing summary/source sections
    let lastSpokenSeg=this.segments.length-1;
    for(let i=this.segments.length-1;i>=0;i--){
      const t=this.segments[i].text.trim();
      if(t.startsWith('源 PDF')||t==='---'||t.match(/^\d+\.\s/)||t==='## 划重点')lastSpokenSeg=i-1;
      else break;
    }
    const spokenEnd=segRanges[lastSpokenSeg]?segRanges[lastSpokenSeg].end:segFullNorm.length;
    const searchText=segFullNorm.substring(0,spokenEnd);
    // Phase 1: Sequential fuzzy match each cue to a position in searchText
    // Robust version: handles VTT content that diverges from article text
    // (e.g. promo intros, extra statistics, different wording from audio source)
    let cursor=0;
    const cuePos=[];
    let consecutiveMisses=0; // track consecutive low-score matches for re-anchoring
    for(let i=0;i<this.cues.length;i++){
      const cn=norm(this.cues[i].text);
      if(!cn||cn.length<1){cuePos.push({pos:cursor,score:0});if(DBG)dbgLog.push({cue:i,text:this.cues[i].text.slice(0,30),strategy:'empty',seg:'-',score:0});continue;}
      const maxLA=Math.max(200,cn.length*15);
      const ss=Math.max(0,cursor-10);
      const se=Math.min(searchText.length,cursor+maxLA);
      // Try exact match first
      let ep=searchText.indexOf(cn,ss);
      if(ep>=0&&ep<se){cuePos.push({pos:ep,score:1});if(DBG)dbgLog.push({cue:i,text:this.cues[i].text.slice(0,30),strategy:'exact',score:1,cursor:ep+cn.length});cursor=ep+cn.length;consecutiveMisses=0;continue;}
      // Fuzzy: slide window, score by charSim
      let bp=-1,bs=0;
      for(let p=ss;p<se;p++){
        const we=Math.min(p+cn.length+3,searchText.length);
        const w=searchText.substring(p,we);
        const sc=charSim(cn,w);
        if(sc>bs){bs=sc;bp=p;if(sc>=0.95)break;}
      }
      // Use higher threshold (0.5) to avoid false matches against wrong text
      // For medium-confidence matches (0.5-0.7), limit cursor advance to prevent big jumps
      if(bs>=0.5&&bp>=0){
        const advance=bp+cn.length;
        if(bs>=0.7){
          // High confidence: advance cursor normally
          cuePos.push({pos:bp,score:bs});if(DBG)dbgLog.push({cue:i,text:this.cues[i].text.slice(0,30),strategy:'fuzzy-high',score:bs,cursor:Math.max(cursor,advance),jumpDist:bp-cursor});cursor=Math.max(cursor,advance);consecutiveMisses=0;
        } else {
          // Medium confidence: accept position but limit cursor advance
          // Don't let cursor jump more than 3x cue length ahead of current position
          const maxJump=cn.length*3;
          if(bp-cursor<=maxJump){
            cuePos.push({pos:bp,score:bs});if(DBG)dbgLog.push({cue:i,text:this.cues[i].text.slice(0,30),strategy:'fuzzy-med',score:bs,cursor:Math.max(cursor,advance),jumpDist:bp-cursor});cursor=Math.max(cursor,advance);consecutiveMisses=0;
          } else {
            // Too far ahead for a low-confidence match — treat as miss
            cursor=Math.min(searchText.length,cursor+1);
            cuePos.push({pos:cursor,score:0});if(DBG)dbgLog.push({cue:i,text:this.cues[i].text.slice(0,30),strategy:'MISS(far-jump)',score:bs,jumpDist:bp-cursor,misses:consecutiveMisses+1});consecutiveMisses++;
          }
        }
      }
      else{
        // No match at all — minimal cursor advance
        cursor=Math.min(searchText.length,cursor+1);
        cuePos.push({pos:cursor,score:0});if(DBG)dbgLog.push({cue:i,text:this.cues[i].text.slice(0,30),strategy:'MISS',score:bs,misses:consecutiveMisses+1});consecutiveMisses++;
      }
      // Re-anchoring: after 2+ consecutive misses, try a wider global search
      // to find where the VTT text picks up again in the article
      if(consecutiveMisses>=2&&i+1<this.cues.length){
        let reanchored=false;
        // Look ahead at next few cues and try to find a strong match anywhere after cursor
        for(let look=1;look<=Math.min(3,this.cues.length-i-1);look++){
          const nextCn=norm(this.cues[i+look].text);
          if(!nextCn||nextCn.length<3)continue;
          // Search the full remaining text
          const gep=searchText.indexOf(nextCn,cursor);
          if(gep>=0){if(DBG)dbgLog.push({cue:i,text:'RE-ANCHOR(exact)',look,target:this.cues[i+look].text.slice(0,30),newCursor:gep});cursor=gep;consecutiveMisses=0;reanchored=true;break;}
          // Try fuzzy global search in remaining text
          let gbp=-1,gbs=0;
          const gse=Math.min(searchText.length,cursor+2000);
          for(let p=cursor;p<gse;p++){
            const we=Math.min(p+nextCn.length+3,searchText.length);
            const w=searchText.substring(p,we);
            const sc=charSim(nextCn,w);
            if(sc>gbs){gbs=sc;gbp=p;if(sc>=0.95)break;}
          }
          if(gbs>=0.7&&gbp>=0){if(DBG)dbgLog.push({cue:i,text:'RE-ANCHOR(fuzzy)',look,target:this.cues[i+look].text.slice(0,30),score:gbs,newCursor:gbp});cursor=gbp;consecutiveMisses=0;reanchored=true;break;}
        }
        if(DBG&&!reanchored)dbgLog.push({cue:i,text:'RE-ANCHOR-FAILED',misses:consecutiveMisses});
      }
    }
    // Phase 2: Convert positions to segment indices
    const posToSeg=pos=>{
      for(let j=0;j<segRanges.length;j++){if(pos<segRanges[j].end)return j;}
      return lastSpokenSeg;
    };
    const rawMap=cuePos.map(cp=>posToSeg(cp.pos));
    // Phase 3: Enforce strict monotonicity
    let cur=rawMap[0];
    for(let i=0;i<rawMap.length;i++){
      const r=rawMap[i];
      if(r>cur){const jump=r-cur;if(jump<=3||cuePos[i].score>=0.5)cur=r;}
      this.segMap.push(Math.min(cur,lastSpokenSeg));
    }
    // Derive time ranges per segment
    const segTimes=new Array(this.segments.length).fill(null);
    for(let i=0;i<this.segMap.length;i++){
      const si=this.segMap[i];
      if(!segTimes[si])segTimes[si]={start:this.cues[i].start,end:this.cues[i].end};
      else{
        segTimes[si].start=Math.min(segTimes[si].start,this.cues[i].start);
        segTimes[si].end=Math.max(segTimes[si].end,this.cues[i].end);
      }
    }
    // Fill gaps: interpolate proportionally between neighboring segments
    for(let i=0;i<segTimes.length;i++){
      if(!segTimes[i]){
        let prevIdx=-1,nextIdx=-1;
        for(let j=i-1;j>=0;j--){if(segTimes[j]){prevIdx=j;break;}}
        for(let j=i+1;j<segTimes.length;j++){if(segTimes[j]){nextIdx=j;break;}}
        if(prevIdx>=0&&nextIdx>=0){
          const gap=segTimes[nextIdx].start-segTimes[prevIdx].end;
          const spans=nextIdx-prevIdx;
          const off=i-prevIdx;
          segTimes[i]={start:segTimes[prevIdx].end+gap*(off-0.5)/spans,end:segTimes[prevIdx].end+gap*(off+0.5)/spans};
        }else if(prevIdx>=0){
          segTimes[i]={start:segTimes[prevIdx].end,end:segTimes[prevIdx].end+0.5};
        }else if(nextIdx>=0){
          segTimes[i]={start:Math.max(0,segTimes[nextIdx].start-0.5),end:segTimes[nextIdx].start};
        }else{
          segTimes[i]={start:0,end:this.cues[this.cues.length-1].end};
        }
      }
    }
    // Make ranges continuous: no gaps, no overlaps
    for(let i=1;i<segTimes.length;i++){
      if(segTimes[i].start>segTimes[i-1].end){
        const mid=(segTimes[i-1].end+segTimes[i].start)/2;
        segTimes[i-1].end=mid;
        segTimes[i].start=mid;
      }else if(segTimes[i].start<segTimes[i-1].end){
        segTimes[i].start=segTimes[i-1].end;
      }
    }
    if(segTimes.length>0){
      segTimes[0].start=0;
      segTimes[segTimes.length-1].end=this.cues[this.cues.length-1].end;
    }
    this._segTimeRanges=segTimes;
    // Debug: detailed per-cue alignment log for TTS
    if(DBG&&dbgLog.length>0){
      console.groupCollapsed('[tts][debug] Per-cue alignment details ('+dbgLog.length+' entries)');
      const stratCount={};
      for(const d of dbgLog){const s=String(d.strategy);stratCount[s]=(stratCount[s]||0)+1;}
      console.log('[tts][debug] Strategy distribution:',stratCount);
      console.table(dbgLog.map(d=>({
        '#':d.cue,
        text:d.text,
        strategy:d.strategy,
        score:typeof d.score==='number'?(d.score===1?'1':d.score.toFixed(3)):'-',
        cursor:d.cursor||'-',
        jump:d.jumpDist||'-',
        misses:d.misses||'-'
      })));
      const misses=dbgLog.filter(d=>String(d.strategy).startsWith('MISS'));
      if(misses.length>0){
        console.groupCollapsed('[tts][debug] \u26a0 MISSES: '+misses.length+' cues');
        for(const m of misses)console.log('  cue#'+m.cue+' "'+m.text+'" score='+((typeof m.score==='number')?m.score.toFixed(3):'-')+' misses='+m.misses);
        console.groupEnd();
      }
      console.groupEnd();
    }
  },

  // Parse WebVTT content
  parseVTT(vttText){
    const cues=[];
    const lines=vttText.split('\n');
    let i=0;
    while(i<lines.length&&!lines[i].includes('-->')){i++;}
    while(i<lines.length){
      const line=lines[i];
      // Support both HH:MM:SS.mmm and MM:SS.mmm timestamp formats
      const m=line.match(/((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})\s*-->\s*((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})/);
      if(m){
        const start=this.parseTime(m[1]);
        const end=this.parseTime(m[2]);
        i++;
        let text='';
        while(i<lines.length&&lines[i].trim()!==''){
          text+=(text?' ':'')+lines[i].trim();
          i++;
        }
        if(text)cues.push({start,end,text});
      }else{
        i++;
      }
    }
    // Post-process: strip trailing garbage cues (repeated/zero-duration/empty content)
    // Common in whisper-generated VTTs where the model hallucinates at the end
    let lastGood=cues.length-1;
    for(let j=cues.length-1;j>=1;j--){
      const c=cues[j];
      // Zero-duration cues
      if(c.end<=c.start){lastGood=j-1;continue;}
      // Duplicate text: same as previous cue or very short repeated content
      if(c.text===cues[j-1].text){lastGood=j-1;continue;}
      // Very short cue that matches a recent cue's text (hallucination loop)
      let isRepeat=false;
      for(let k=Math.max(0,j-5);k<j;k++){
        if(cues[k].text===c.text){isRepeat=true;break;}
      }
      if(isRepeat){lastGood=j-1;continue;}
      break;
    }
    return cues.slice(0,lastGood+1);
  },

  parseTime(s){
    const p=s.replace(',','.').split(':');
    if(p.length===2) return parseInt(p[0])*60+parseFloat(p[1]);
    const sec=parseFloat(p[2]);
    return parseInt(p[0])*3600+parseInt(p[1])*60+sec;
  },

  formatTime(sec){
    const m=Math.floor(sec/60);
    const s=Math.floor(sec%60);
    return m+':'+(s<10?'0':'')+s;
  },

  toggleBar(){
    if(!document.querySelector('.art-body'))return;
    this.barVisible=!this.barVisible;
    ttsBar.classList.toggle('on',this.barVisible);
    ttsToggle.classList.toggle('active',this.barVisible);
    if(!this.barVisible)this.stop();
  },

  async play(){
    // Resume from pause
    if(this.paused&&this.audio){
      this.audio.play().catch(e=>this._onPlayFail(e));
      this.paused=false;
      this.playing=true;
      this.updateUI();
      return;
    }
    // If audio already loaded, replay (or seek if _pendingSeekText)
    if(this.audio&&this.audio.src){
      if(this._pendingSeekText){
        const seekText=this._pendingSeekText;
        this._pendingSeekText=null;
        if(!this.segments.length) this.buildSegments();
        const sIdx=this.findSegmentByText(seekText);
        console.log('[tts] play() cached path: pendingSeek segIdx=',sIdx,'segTimeRanges=',this._segTimeRanges?.length);
        if(sIdx>=0&&this._segTimeRanges&&this._segTimeRanges[sIdx]){
          this.audio.currentTime=this._segTimeRanges[sIdx].start;
          console.log('[tts] play() seeking to',this._segTimeRanges[sIdx].start);
        }else{
          this.audio.currentTime=0;
        }
      }else{
        this.audio.currentTime=0;
      }
      this.audio.playbackRate=this.speed;
      this.audio.play().catch(e=>this._onPlayFail(e));
      this.playing=true;
      this.paused=false;
      this.updateUI();
      return;
    }
    // Generate TTS
    const text=this.getArticleText();
    if(!text)return;
    this.generating=true;
    ttsPlay.innerHTML='⏳ 生成中...';
    ttsPlay.disabled=true;
    try{
      const r=await fetch('/api/tts',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text, id:curId||'unknown'})
      });
      const d=await r.json();
      if(!d.ok){
        showToast('TTS 生成失败: '+(d.error||''));
        return;
      }
      // Load subtitle/audio with absolute URLs for Android WebView diagnostics
      const subtitleUrl=new URL(d.subtitle, location.origin).href;
      const audioUrl=new URL(d.audio, location.origin).href;
      console.log('[tts] generated', {audio: audioUrl, subtitle: subtitleUrl, cached: d.cached});
      const vttR=await fetch(subtitleUrl,{cache:'no-store'});
      if(!vttR.ok)throw new Error('字幕加载失败 HTTP '+vttR.status);
      const vttText=await vttR.text();
      this.cues=this.parseVTT(vttText);
      this.buildSegments();
      this.buildSegMap();
      // Create audio
      if(this.audio){this.audio.pause();this.audio.removeAttribute('src');}
      this.audio=new Audio(audioUrl);
      this.audio.playbackRate=this.speed;
      // Time update → highlight sync
      this.audio.addEventListener('timeupdate',()=>this.onTimeUpdate());
      this.audio.addEventListener('ended',()=>{
        this.playing=false;
        this.paused=false;
        this.clearHighlight();
        this.curCueIdx=-1;
        this.updateUI();
      });
      this.playing=true;
      this.paused=false;
      // If there's a pending seek (from "play from here"), play first then seek once playable
      if(this._pendingSeekText){
        const seekText=this._pendingSeekText;
        this._pendingSeekText=null;
        if(!this.segments.length) this.buildSegments();
        const sIdx=this.findSegmentByText(seekText);
        const seekTime=(sIdx>=0&&this._segTimeRanges&&this._segTimeRanges[sIdx])?this._segTimeRanges[sIdx].start:0;
        console.log('[tts] play() fresh gen: pendingSeek segIdx=',sIdx,'seekTime=',seekTime);
        // Start playback, then seek once metadata is loaded
        const aud=this.audio;
        const doSeek=()=>{
          console.log('[tts] doSeek: seeking to',seekTime,'readyState=',aud.readyState,'duration=',aud.duration);
          aud.currentTime=seekTime;
          // Verify seek took effect
          const verifyCb=()=>{
            console.log('[tts] seeked event: currentTime=',aud.currentTime);
          };
          aud.addEventListener('seeked',verifyCb,{once:true});
        };
        // loadedmetadata means duration is known and seeking is possible
        if(aud.readyState>=1){
          doSeek();
          aud.play().catch(e=>this._onPlayFail(e));
        }else{
          aud.addEventListener('loadedmetadata',()=>{
            doSeek();
            aud.play().catch(e=>this._onPlayFail(e));
          },{once:true});
          // Trigger loading
          aud.load();
        }
      }else{
        this.audio.play().catch(e=>this._onPlayFail(e));
      }
    }catch(e){
      const msg=(e&&e.message)?e.message:String(e);
      console.error('TTS error:',e);
      showToast('TTS 请求失败: '+msg);
    }finally{
      this.generating=false;
      ttsPlay.disabled=false;
      this.updateUI();
    }
  },

  _onPlayFail(e){console.warn('[tts] play() rejected:',e);this.playing=false;this.paused=false;this.updateUI();
    // Mobile browsers reject play() outside a user gesture (e.g. our async
    // play after loadedmetadata). Surface it instead of failing silently.
    if(e&&(e.name==='NotAllowedError'||e.name==='AbortError'))showToast('▶️ 浏览器拦截了自动播放，请再点一次播放按钮');},
  pause(){
    if(this.audio&&this.playing){
      this.audio.pause();
      this.paused=true;
      this.playing=false;
      this.updateUI();
    }
  },

  stop(){
    if(this.audio){
      this.audio.pause();
      this.audio.currentTime=0;
    }
    this.clearHighlight();
    this.curCueIdx=-1;
    this.playing=false;
    this.paused=false;
    this.updateUI();
  },

  onTimeUpdate(){
    if(!this.audio||!this.segments.length||!this._segTimeRanges||!this._segTimeRanges.length)return;
    const t=this.audio.currentTime;
    const dur=this.audio.duration||1;
    // Update progress bar
    ttsProgressFill.style.width=((t/dur)*100)+'%';
    // Update time display
    ttsInfo.textContent=this.formatTime(t)+' / '+this.formatTime(dur);
    // Find which segment the current time falls into
    // Use binary search for efficiency, then allow forward-only progression
    const ranges=this._segTimeRanges;
    let sIdx=-1;
    // Binary search: find the last segment whose start <= t
    let lo=0,hi=ranges.length-1;
    while(lo<=hi){
      const mid=(lo+hi)>>1;
      if(ranges[mid].start<=t)lo=mid+1;
      else hi=mid-1;
    }
    // hi is now the last segment with start<=t
    if(hi>=0){
      // Check if t is within this segment's range
      if(t<ranges[hi].end){sIdx=hi;}
      // If t >= end, we're in a gap or past this segment — snap to next
      else if(hi+1<ranges.length){sIdx=hi+1;}
      else{sIdx=hi;} // past everything, stay on last
    }else if(ranges.length>0){
      sIdx=0; // before first segment starts
    }
    // Enforce forward-only: never go backwards (except on explicit seek)
    if(sIdx>=0){
      // Detect seek: time jumped backwards significantly
      const isSeeking=this._lastTime!==undefined&&t<this._lastTime-1.0;
      if(!isSeeking&&this.curCueIdx>=0&&sIdx<this.curCueIdx){
        sIdx=this.curCueIdx; // prevent backward jumps during normal playback
      }
    }
    this._lastTime=t;
    if(sIdx>=0&&sIdx!==this.curCueIdx){
      this.curCueIdx=sIdx;
      this.highlightSegment(this.segments[sIdx]);
    }
  },

  highlightSegment(seg){
    if(this._hlEl===seg?.el)return;
    if(this._hlEl){try{this._hlEl.classList.remove('tts-highlight')}catch{}}
    this._hlEl=null;
    if(!seg||!seg.el)return;
    seg.el.classList.add('tts-highlight');
    this._hlEl=seg.el;
    scrollElIntoView(seg.el);
  },

  clearHighlight(){
    if(this._hlEl){try{this._hlEl.classList.remove('tts-highlight')}catch{}this._hlEl=null;}
    // Defensive: also clear any stragglers in case DOM was rebuilt
    document.querySelectorAll('.tts-highlight').forEach(el=>el.classList.remove('tts-highlight'));
  },

  updateUI(){
    if(this.generating){
      ttsPlay.innerHTML='⏳ 生成中...';
    }else if(this.playing){
      ttsPlay.innerHTML='❚❚ 暂停';
    }else if(this.paused){
      ttsPlay.innerHTML='▶ 继续';
    }else{
      ttsPlay.innerHTML='▶ 播放';
    }
    if(!this.audio||!this.audio.duration){
      if(!this.generating)ttsInfo.textContent='';
    }
    ttsSpeedSel.value=String(this.speed);
  },

  setSpeed(val){
    this.speed=parseFloat(val)||1.0;
    if(this.audio)this.audio.playbackRate=this.speed;
    this.updateUI();
  },

  seekTo(ratio){
    if(!this.audio||!this.audio.duration)return;
    this.audio.currentTime=ratio*this.audio.duration;
    if(!this.playing&&!this.paused){
      // Just seeking without playing — show position
      this.onTimeUpdate();
    }
  }
};

ttsToggle.addEventListener('click',()=>TTS.toggleBar());
ttsPlay.addEventListener('click',()=>{
  if(TTS.generating)return;
  if(TTS.playing) TTS.pause();
  else TTS.play();
});
ttsStop.addEventListener('click',()=>TTS.stop());
ttsSpeedSel.addEventListener('change',()=>TTS.setSpeed(ttsSpeedSel.value));
ttsProgress.addEventListener('click',(e)=>{
  const rect=ttsProgress.getBoundingClientRect();
  const ratio=(e.clientX-rect.left)/rect.width;
  TTS.seekTo(Math.max(0,Math.min(1,ratio)));
});

// Click highlighted text to pause/resume TTS or InlineAudio
document.getElementById('ct').addEventListener('click',(e)=>{
  const hl=e.target.closest('.tts-highlight');
  if(!hl)return;
  // Check if this is an InlineAudio highlight
  if(hl.classList.contains('inline-audio-hl')){
    // Find which InlineAudio session owns this element
    for(const [src,s] of InlineAudio.active){
      const idx=s.segments.findIndex(seg=>seg.el===hl);
      if(idx>=0){
        if(s.audio.paused) s.audio.play();
        else s.audio.pause();
        break;
      }
    }
    return;
  }
  // Original TTS pause/resume
  if(TTS.generating)return;
  if(TTS.playing) TTS.pause();
  else if(TTS.paused) TTS.play();
});

// ── 内嵌 MP3 字幕跟读 ─────────────────────────
const InlineAudio={
  // Debug mode: set InlineAudio.debug=true in console, or add ?debug=1 to URL
  debug: new URLSearchParams(location.search).has('debug'),
  // Track active follow-along sessions: audioSrc -> {audio, cues, segments, segMap, segTimeRanges, btn, cleanup}
  active: new Map(),

  async toggleFollowAlong(btn){
    const audioSrc=btn.dataset.audioSrc;
    const audioRel=btn.dataset.audioRel;
    // If already active, deactivate
    if(this.active.has(audioSrc)){
      this.deactivate(audioSrc);
      return;
    }
    // Find the audio element in the same .audio-embed container
    const embed=btn.closest('.audio-embed');
    if(!embed)return;
    const audio=embed.querySelector('audio');
    if(!audio)return;
    // Check if VTT exists / request transcription
    btn.textContent='⏳ 检查字幕...';
    btn.disabled=true;
    try{
      const vttUrl=await this.ensureVTT(audioRel,btn);
      if(!vttUrl){
        btn.textContent='🔤 字幕跟读';
        btn.disabled=false;
        return;
      }
      // Load VTT
      const vttR=await fetch(vttUrl,{cache:'no-store'});
      if(!vttR.ok)throw new Error('VTT load failed');
      const vttText=await vttR.text();
      const cues=TTS.parseVTT(vttText);
      if(!cues.length){
        showToast('字幕文件为空',2000);
        btn.textContent='🔤 字幕跟读';
        btn.disabled=false;
        return;
      }
      // Build segments from article body
      // Shared with TTS + align.py (see collectArticleSegments).
      const segments=collectArticleSegments();
      // Build segment map: try semantic alignment first, fall back to LCS
      let segMap,segTimeRanges;
      try{
        // Try embedding-based semantic alignment (much better for oral vs written text)
        const alignR=await fetch('/api/align',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({articleId:curId,vttPath:btn.dataset.audioRel.replace(/\.[^.]+$/,'.vtt')})
        });
        const alignD=await alignR.json();
        if(alignD.ok&&alignD.segMap&&alignD.segTimeRanges){
          // Validate: segTimeRanges length must match frontend segment count
          if(alignD.segTimeRanges.length!==segments.length){
            console.warn('[inline-audio] Alignment segment count mismatch: align='+alignD.segTimeRanges.length+' dom='+segments.length+', falling back to LCS');
            throw new Error('segment count mismatch (align='+alignD.segTimeRanges.length+' dom='+segments.length+')');
          }
          segMap=alignD.segMap;
          segTimeRanges=alignD.segTimeRanges;
          console.log('[inline-audio] Using embedding alignment:',alignD.stats||'cached');
          showToast('\u2728 \u8bed\u4e49\u5bf9\u9f50\u5df2\u52a0\u8f7d'+(alignD.cached?' (\u7f13\u5b58)':''),2000);
        }else{
          throw new Error(alignD.error||'alignment failed');
        }
      }catch(alignErr){
        console.log('[inline-audio] Embedding alignment unavailable, using LCS:',alignErr.message);
        ({segMap,segTimeRanges}=this.buildSegMap(cues,segments));
      }
      // Set up timeupdate listener
      let curIdx=-1;
      let lastT=-1;
      const onTimeUpdate=()=>{
        const t=audio.currentTime;
        let sIdx=-1;
        // Binary search: find the last segment whose start <= t
        let lo=0,hi=segTimeRanges.length-1;
        while(lo<=hi){
          const mid=(lo+hi)>>1;
          if(segTimeRanges[mid]&&segTimeRanges[mid].start<=t)lo=mid+1;
          else hi=mid-1;
        }
        if(hi>=0){
          sIdx=hi;
        }else if(segTimeRanges.length>0){
          sIdx=0;
        }
        // Forward-only unless explicit seek (time jumped back >1s).
        // Allow small backward corrections (within 2 segments) so a brief
        // alignment overshoot can self-correct on the next tick.
        if(sIdx>=0){
          const isSeeking=lastT>=0&&t<lastT-1.0;
          if(!isSeeking&&curIdx>=0&&sIdx<curIdx-2)sIdx=curIdx;
        }
        lastT=t;
        if(sIdx>=0&&sIdx!==curIdx){
          curIdx=sIdx;
          // Clear old highlights from this session
          document.querySelectorAll('.inline-audio-hl').forEach(el=>el.classList.remove('inline-audio-hl','tts-highlight','inline-audio-paused'));
          if(segments[sIdx]&&segments[sIdx].el){
            segments[sIdx].el.classList.add('tts-highlight','inline-audio-hl');
            scrollElIntoView(segments[sIdx].el);
          }
        }
      };
      audio.addEventListener('timeupdate',onTimeUpdate);
      // Sync pause/play state when user uses native audio controls
      const onPlay=()=>{
        document.querySelectorAll('.inline-audio-hl.inline-audio-paused').forEach(el=>el.classList.remove('inline-audio-paused'));
        btn.textContent='⏹ 关闭跟读';
      };
      const onPause=()=>{
        // Only show paused state if not ended and still active
        if(!audio.ended&&this.active.has(audioSrc)){
          document.querySelectorAll('.inline-audio-hl').forEach(el=>el.classList.add('inline-audio-paused'));
          btn.textContent='▶️ 继续播放';
        }
      };
      audio.addEventListener('play',onPlay);
      audio.addEventListener('pause',onPause);
      // Cleanup when audio ends
      const onEnded=()=>this.deactivate(audioSrc);
      audio.addEventListener('ended',onEnded);
      // Store state
      this.active.set(audioSrc,{audio,cues,segments,segMap,segTimeRanges,btn,onTimeUpdate,onEnded,onPlay,onPause,curIdx});
      btn.textContent='⏹ 关闭跟读';
      btn.classList.add('active');
      btn.disabled=false;
      showToast('✅ 字幕跟读已开启');
    }catch(e){
      console.error('[inline-audio]',e);
      showToast('❌ '+e.message,3000);
      btn.textContent='🔤 字幕跟读';
      btn.disabled=false;
    }
  },

  deactivate(audioSrc){
    const s=this.active.get(audioSrc);
    if(!s)return;
    s.audio.removeEventListener('timeupdate',s.onTimeUpdate);
    s.audio.removeEventListener('ended',s.onEnded);
    s.audio.removeEventListener('play',s.onPlay);
    s.audio.removeEventListener('pause',s.onPause);
    document.querySelectorAll('.inline-audio-hl').forEach(el=>el.classList.remove('inline-audio-hl','tts-highlight','inline-audio-paused'));
    s.btn.textContent='🔤 字幕跟读';
    s.btn.classList.remove('active');
    this.active.delete(audioSrc);
  },

  // Seek to text position in active inline audio (called from share bar)
  seekToText(searchText){
    if(!this.active.size)return false;
    // Use the first (usually only) active session
    const [audioSrc,s]=this.active.entries().next().value;
    const {audio,segments,segTimeRanges}=s;
    if(!segments||!segments.length||!segTimeRanges||!segTimeRanges.length)return false;
    // Find segment matching selected text
    const norm=t=>t.replace(/[\s\u3000]/g,'').toLowerCase();
    const needle=norm(searchText).slice(0,50);
    if(!needle)return false;
    let sIdx=-1;
    // Exact substring match
    for(let i=0;i<segments.length;i++){
      if(norm(segments[i].text).includes(needle)){sIdx=i;break;}
    }
    // Fallback: best prefix overlap
    if(sIdx<0){
      let bestIdx=0,bestScore=0;
      for(let i=0;i<segments.length;i++){
        const segN=norm(segments[i].text);
        let score=0;
        for(let j=0;j<needle.length&&j<segN.length;j++){
          if(segN.includes(needle.slice(0,j+1)))score=j+1;
          else break;
        }
        if(score>bestScore){bestScore=score;bestIdx=i;}
      }
      if(bestScore>=3)sIdx=bestIdx;
    }
    if(sIdx<0)return false;
    // Seek audio
    if(segTimeRanges[sIdx]){
      audio.currentTime=segTimeRanges[sIdx].start;
      if(audio.paused)audio.play();
      console.log('[inline-audio] seekToText: segment',sIdx,'time',segTimeRanges[sIdx].start);
      return true;
    }
    return false;
  },

  async ensureVTT(audioRel,btn){
    // audioRel is relative path within vault, e.g. "raw/course/audio.mp3"
    // First, try to fetch VTT directly
    const vttRel=audioRel.replace(/\.[^.]+$/,'.vtt');
    const vttUrl='/vault/'+vttRel.split('/').map(s=>encodeURIComponent(s)).join('/');
    try{
      const check=await fetch(vttUrl,{method:'HEAD'});
      if(check.ok)return vttUrl;
    }catch(e){}
    // VTT doesn't exist, request transcription
    btn.textContent='⏳ 转录中...';
    const r=await fetch('/api/transcribe',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({audioPath:audioRel})
    });
    const d=await r.json();
    if(!d.ok){
      showToast('❌ 转录失败: '+(d.error||''),3000);
      return null;
    }
    if(d.status==='done'||d.cached)return vttUrl;
    // Poll for completion
    return new Promise((resolve)=>{
      let attempts=0;
      const maxAttempts=180; // ~3 minutes at 1s intervals
      const poll=async()=>{
        attempts++;
        if(attempts>maxAttempts){
          showToast('❌ 转录超时',3000);
          resolve(null);
          return;
        }
        btn.textContent='⏳ 转录中 ('+attempts+'s)...';
        try{
          const sr=await fetch('/api/transcribe/status',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({audioPath:audioRel})
          });
          const sd=await sr.json();
          if(sd.status==='done'){
            resolve(vttUrl);
            return;
          }else if(sd.status==='not_started'){
            // Transcription failed silently
            showToast('❌ 转录失败',3000);
            resolve(null);
            return;
          }
        }catch(e){}
        setTimeout(poll,1000);
      };
      setTimeout(poll,1000);
    });
  },

  buildSegMap(cues,segments){
    const segMap=[];
    const segTimeRanges=[];
    if(!cues.length||!segments.length)return{segMap,segTimeRanges};
    const DBG=this.debug;
    const dbgLog=[];  // collect per-cue debug entries

    /* -- Robust text-matching with intro detection & divergence recovery --
       The audio may differ from article text (ASR errors, extra spoken content,
       different wording). We handle:
       1. Intro/ad segments in audio not present in article
       2. Article text not present in audio (skipped sections)
       3. Audio content not in article (ad-lib, extra examples)
       4. ASR transcription errors (wrong characters)
       5. Hallucinated repeated cues at end of VTT */

    const n=segments.length;

    // Normalize: strip whitespace & punctuation, keep CJK/letters/digits
    function norm(t){
      return t.replace(/[\s\u3000\u00A0]/g,'')
              .replace(/[^\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaffa-zA-Z0-9]/g,'')
              .toLowerCase();
    }

    // LCS-based similarity (handles insertions/deletions better than position-aligned)
    function lcsRatio(a,b){
      if(!a||!b)return 0;
      const m=a.length,nn=b.length;
      if(!m||!nn)return 0;
      // Optimized: only keep 2 rows
      let prev=new Array(nn+1).fill(0);
      let curr=new Array(nn+1).fill(0);
      for(let i=1;i<=m;i++){
        for(let j=1;j<=nn;j++){
          if(a[i-1]===b[j-1])curr[j]=prev[j-1]+1;
          else curr[j]=Math.max(prev[j],curr[j-1]);
        }
        [prev,curr]=[curr,prev];
        curr.fill(0);
      }
      return prev[nn]/Math.max(m,nn);
    }

    // Build concatenated segment text
    const segNorms=segments.map(s=>norm(s.text));
    let segFull='';
    const segRanges=[];
    for(let i=0;i<n;i++){
      const start=segFull.length;
      segFull+=segNorms[i];
      segRanges.push({start,end:segFull.length});
    }

    function posToSeg(pos){
      for(let i=0;i<n;i++){
        if(pos<segRanges[i].end)return i;
      }
      return n-1;
    }

    // Clean cues: detect and truncate hallucinated repeated tails
    let effectiveCueCount=cues.length;
    if(cues.length>10){
      // Check last 30 cues for repetitive content
      const tailStart=Math.max(0,cues.length-30);
      let repStart=-1;
      for(let i=tailStart;i<cues.length-2;i++){
        const t=norm(cues[i].text);
        if(t.length<2)continue;
        let repCount=0;
        for(let j=i+1;j<cues.length;j++){
          const t2=norm(cues[j].text);
          if(t2===t||lcsRatio(t,t2)>0.8)repCount++;
        }
        if(repCount>=3){
          repStart=i;
          break;
        }
      }
      if(repStart>0)effectiveCueCount=repStart;
    }

    const cueNorms=[];
    for(let i=0;i<effectiveCueCount;i++)cueNorms.push(norm(cues[i].text));

    // Phase 1: Detect intro cues
    // Find the first cue whose text appears in segFull (anywhere, not just start)
    // This handles cases where article starts with text not present in audio
    let introEnd=0;
    for(let i=0;i<Math.min(effectiveCueCount,30);i++){
      const cn=cueNorms[i];
      if(cn.length<4)continue;
      const pos=segFull.indexOf(cn,0);
      if(pos>=0){
        introEnd=i;
        break;
      }
      // Also try fuzzy for first content cue
      let found=false;
      const searchLimit=Math.min(segFull.length,500);
      for(let p=0;p<searchLimit-cn.length+1;p++){
        const w=segFull.slice(p,p+cn.length+2);
        if(lcsRatio(cn,w)>=0.75){found=true;break;}
      }
      if(found){introEnd=i;break;}
    }
    // Assign all cues before introEnd to segment 0
    if(DBG&&introEnd>0)console.log('[inline-audio][debug] intro detected: cues 0-'+(introEnd-1)+' assigned to seg 0');
    for(let i=0;i<introEnd;i++){
      segMap.push(0);
      if(DBG)dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'intro',seg:0,score:0,cursor:0});
    }

    // Phase 2: Forward-matching from introEnd onward
    let cursor=0;   // position in segFull
    let lastSeg=0;  // monotonic segment tracker
    let consecutiveMisses=0; // track failed matches for recovery
    // Time-proportional cursor advance: when cues miss, estimate position from timing
    const totalDuration=cues[effectiveCueCount-1]?cues[effectiveCueCount-1].end:1;
    const spokenLen=segFull.length;

    for(let i=introEnd;i<effectiveCueCount;i++){
      const cn=cueNorms[i];
      if(!cn){
        segMap.push(lastSeg);
        continue;
      }

      let matched=false;

      // Strategy 1: exact substring forward match
      if(cn.length>=2){
        // Limit search range for short cues to prevent false matches far ahead
        // <=3 chars: cursor+200, 4-6 chars: cursor + len*50, 7+: cursor + len*80
        const maxSearch=(cn.length<=3)?Math.min(segFull.length,cursor+200)
                       :(cn.length<=6)?Math.min(segFull.length,cursor+cn.length*50)
                       :Math.min(segFull.length,cursor+cn.length*80+200);
        const pos=segFull.indexOf(cn,Math.max(0,cursor-5));
        if(pos>=0&&pos<maxSearch){
          const seg=posToSeg(pos);
          if(seg>=lastSeg){
            // Guard: ALL cues that jump far must be validated with lookahead.
            // Short cues are more susceptible to false positives (common substrings).
            let acceptMatch=true;
            const jumpDist=pos-cursor;
            const jumpThreshold=(cn.length<=3)?50:(cn.length<=6)?cn.length*12:cn.length*20;
            if(jumpDist>jumpThreshold){
              // Look ahead at next few substantive cues to validate the jump
              let validated=0,checked=0;
              const lookCursor=pos+cn.length;
              for(let la=1;la<=5&&(i+la)<effectiveCueCount&&checked<3;la++){
                const laCn=cueNorms[i+la];
                if(!laCn||laCn.length<3)continue;
                checked++;
                // Check if this future cue can be found near the proposed position
                const laSearchEnd=Math.min(segFull.length,lookCursor+laCn.length*5+80);
                const laPos=segFull.indexOf(laCn,lookCursor);
                if(laPos>=0&&laPos<laSearchEnd){validated++;continue;}
                // Try fuzzy
                let laFound=false;
                const laBuf=Math.max(3,Math.min(8,Math.ceil(laCn.length*0.35)));
                for(let p=lookCursor;p<laSearchEnd-laCn.length+1;p++){
                  const w=segFull.slice(p,p+laCn.length+laBuf);
                  if(lcsRatio(laCn,w)>=0.6){laFound=true;break;}
                }
                if(laFound)validated++;
              }
              // If we checked at least 1 future cue and none validated, reject
              if(checked>0&&validated===0)acceptMatch=false;
            }
            if(acceptMatch){
              segMap.push(seg);
              if(DBG)dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'exact',seg,score:1,cursor:pos+cn.length,jumpDist:pos-cursor,segText:segments[seg].text.slice(0,30)});
              cursor=pos+cn.length;
              lastSeg=seg;
              matched=true;
              consecutiveMisses=0;
            } else if(DBG){
              dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'exact-rejected',reason:'lookahead failed',jumpDist:pos-cursor,score:1});
            }
          }
        }
      }

      // Strategy 1.5: Lookahead-merge match for short cues
      // When a short cue alone is too ambiguous, concatenate it with the next N cues
      // to form a longer query string that's much more likely to match.
      // Data shows: merging 3 cues raises match rate from ~8% to ~90%.
      if(!matched&&cn.length<=25){
        const mergeCount=cn.length<=6?7:cn.length<=10?5:cn.length<=15?4:3;
        let merged=cn;
        const mergeEnd=Math.min(effectiveCueCount,i+mergeCount);
        for(let mi=i+1;mi<mergeEnd;mi++){if(cueNorms[mi])merged+=cueNorms[mi];}
        if(merged.length>=8){
          // Search a generous window (oral text may diverge significantly from written)
          const mSearchEnd=Math.min(segFull.length,cursor+merged.length*6+300+consecutiveMisses*80);
          // Try exact first
          const mExact=segFull.indexOf(merged,Math.max(0,cursor-10));
          if(mExact>=0&&mExact<mSearchEnd){
            const seg=posToSeg(mExact);
            if(seg>=lastSeg){
              segMap.push(seg);
              if(DBG)dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'merge-exact',seg,score:1,cursor:mExact+cn.length,mergeLen:merged.length,segText:segments[seg].text.slice(0,30)});
              cursor=mExact+cn.length; // advance only by this cue's length
              lastSeg=seg;
              matched=true;
              consecutiveMisses=0;
            }
          }
          if(!matched){
            // LCS fuzzy on merged string
            let mBestPos=-1,mBestScore=0;
            const mWinBuf=Math.max(5,Math.min(15,Math.ceil(merged.length*0.25)));
            const mStep=Math.max(1,Math.floor(merged.length/8));
            for(let p=Math.max(0,cursor-10);p<mSearchEnd-merged.length+1;p+=mStep){
              const w=segFull.slice(p,Math.min(p+merged.length+mWinBuf,segFull.length));
              const sc=lcsRatio(merged,w);
              if(sc>mBestScore){mBestScore=sc;mBestPos=p;}
              if(sc>=0.85)break;
            }
            // Lower threshold for merged strings (longer = more reliable even at lower scores)
            const mThreshold=merged.length>=30?0.35:merged.length>=15?0.40:0.45;
            if(mBestScore>=mThreshold&&mBestPos>=0){
              const seg=posToSeg(mBestPos);
              // Guard: don't let merge-lcs jump too many segments on low confidence
              const segJump=seg-lastSeg;
              const mergeAccept=mBestScore>=0.6||segJump<=3||(mBestScore>=0.45&&segJump<=5);
              if(seg>=lastSeg&&mergeAccept){
                segMap.push(seg);
                if(DBG)dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'merge-lcs',seg,score:mBestScore,cursor:mBestPos+cn.length,mergeLen:merged.length,segText:segments[seg].text.slice(0,30)});
                cursor=mBestPos+cn.length;
                lastSeg=seg;
                matched=true;
                consecutiveMisses=0;
              } else if(DBG&&seg>=lastSeg){
                dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'merge-lcs-rejected',reason:'seg jump '+segJump+' at score '+mBestScore.toFixed(3),seg,score:mBestScore});
              }
            }
          }
        }
      }

      // Strategy 2: LCS-based sliding window fuzzy match
      if(!matched&&cn.length>=3){
        // Wider search window when we've had consecutive misses (audio-article divergence)
        const baseWindow=cn.length+30;
        const missMultiplier=Math.min(10,3+consecutiveMisses);
        const searchEnd=Math.min(segFull.length,cursor+baseWindow*missMultiplier);
        let bestPos=-1,bestScore=0;
        const step=1; // use step=1 for all cue lengths to avoid skipping matches
        // Window buffer: slightly larger to capture ASR variations
        const winBuf=Math.max(3,Math.min(8,Math.ceil(cn.length*0.35)));
        for(let p=Math.max(0,cursor-5);p<searchEnd-cn.length+1;p+=step){
          const wEnd=Math.min(p+cn.length+winBuf,segFull.length);
          const w=segFull.slice(p,wEnd);
          const sc=lcsRatio(cn,w);
          if(sc>bestScore){bestScore=sc;bestPos=p;}
          if(sc>=0.9)break; // good enough, stop early
        }
        // Adaptive threshold: short cues need higher confidence,
        // but not so high that ASR errors cause constant misses
        let threshold=0.5;
        if(cn.length<=4)threshold=0.65; // very short: somewhat strict
        else if(cn.length<=6)threshold=0.55; // short: moderate
        // During consecutive misses, lower thresholds progressively to allow recovery
        if(consecutiveMisses>=5)threshold=Math.min(threshold,0.40);
        else if(consecutiveMisses>=2)threshold=Math.min(threshold,0.50);
        if(bestScore>=threshold&&bestPos>=0){
          // Use match CENTER for segment assignment to avoid cross-boundary false matches
          // When the sliding window spans a segment boundary, bestPos may fall in the
          // previous segment even though the cue really belongs to the next one.
          const matchCenter=bestPos+Math.floor(cn.length/2);
          // Guard: don't let a low-confidence match jump too far
          const jumpDist=bestPos-cursor;
          const maxReasonableJump=cn.length*8;
          if(bestScore<0.7&&jumpDist>maxReasonableJump){
            // Suspicious: low-confidence match far ahead — validate with lookahead
            let validated=0,checked=0;
            for(let la=1;la<=3&&(i+la)<effectiveCueCount&&checked<2;la++){
              const laCn=cueNorms[i+la];
              if(!laCn||laCn.length<3)continue;
              checked++;
              const laPos=segFull.indexOf(laCn,bestPos+cn.length);
              if(laPos>=0&&laPos<bestPos+cn.length+laCn.length*5){validated++;}
            }
            if(checked===0||validated>0){
              const seg=posToSeg(matchCenter);
              if(seg>=lastSeg){segMap.push(seg);if(DBG)dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'lcs-validated',seg,score:bestScore,cursor:bestPos+cn.length,jumpDist:bestPos-cursor,segText:segments[seg].text.slice(0,30)});cursor=bestPos+cn.length;lastSeg=seg;matched=true;consecutiveMisses=0;}
            } else if(DBG){
              dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'lcs-rejected',reason:'lookahead failed (far jump)',score:bestScore,jumpDist:bestPos-cursor});
            }
          } else {
            const seg=posToSeg(matchCenter);
            if(seg>=lastSeg){
              segMap.push(seg);
              if(DBG)dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'lcs',seg,score:bestScore,cursor:bestPos+cn.length,jumpDist:bestPos-cursor,segText:segments[seg].text.slice(0,30)});
              cursor=bestPos+cn.length;
              lastSeg=seg;
              matched=true;
              consecutiveMisses=0;
            }
          }
        }
      }

      // Strategy 3: Recovery — trigger earlier (2 consecutive misses)
      // to re-anchor alignment (audio may have extra content not in article)
      if(!matched&&consecutiveMisses>=1&&cn.length>=2){
        // Recovery: search the entire remaining segFull for this cue
        // Trigger earlier (1 miss instead of 2) and accept shorter cues (2 instead of 3)
        const pos=segFull.indexOf(cn,cursor);
        if(pos>=0){
          const seg=posToSeg(pos);
          // Guard: limit segment jumps for short exact recovery matches
          const reSegJump=seg-lastSeg;
          const reAccept=cn.length>=10||reSegJump<=3||(cn.length>=5&&reSegJump<=5)||(consecutiveMisses>=10&&reSegJump<=8);
          if(seg>=lastSeg&&reAccept){
            segMap.push(seg);
            if(DBG)dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'recovery-exact',seg,score:1,cursor:pos+cn.length,misses:consecutiveMisses,segText:segments[seg].text.slice(0,30)});
            cursor=pos+cn.length;
            lastSeg=seg;
            matched=true;
            consecutiveMisses=0;
          } else if(DBG&&seg>=lastSeg){
            dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'recovery-exact-rejected',reason:'seg jump '+reSegJump+' for short cue len='+cn.length,seg,misses:consecutiveMisses});
          }
        }
        if(!matched){
          // Try LCS over broader range — scale with misses for faster recovery
          const broadEnd=Math.min(segFull.length,cursor+cn.length*60+consecutiveMisses*200);
          const bWinBuf=Math.max(3,Math.min(8,Math.ceil(cn.length*0.35)));
          let bestPos=-1,bestScore=0;
          for(let p=cursor;p<broadEnd-cn.length+1;p++){
            const w=segFull.slice(p,p+cn.length+bWinBuf);
            const sc=lcsRatio(cn,w);
            if(sc>bestScore){bestScore=sc;bestPos=p;}
            if(sc>=0.85)break;
          }
          // Lower recovery threshold when misses are high
          const recThreshold=consecutiveMisses>=5?0.35:0.42;
          if(bestScore>=recThreshold&&bestPos>=0){
            const seg=posToSeg(bestPos+Math.floor(cn.length/2));
            // Guard: limit segment jumps for low-confidence recovery matches
            const recSegJump=seg-lastSeg;
            const recAccept=bestScore>=0.6||recSegJump<=3||(bestScore>=0.45&&recSegJump<=5)||(consecutiveMisses>=10&&recSegJump<=8);
            if(seg>=lastSeg&&recAccept){
              segMap.push(seg);
              if(DBG)dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'recovery-lcs',seg,score:bestScore,cursor:bestPos+cn.length,misses:consecutiveMisses,segText:segments[seg].text.slice(0,30)});
              cursor=bestPos+cn.length;
              lastSeg=seg;
              matched=true;
              consecutiveMisses=0;
            } else if(DBG&&seg>=lastSeg){
              dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'recovery-lcs-rejected',reason:'seg jump '+recSegJump+' at score '+bestScore.toFixed(3),seg,score:bestScore,misses:consecutiveMisses});
            }
          }
        }
      }

      // Strategy 4: Time-proportional cursor advance on miss
      // Instead of +1 (too slow, cursor gets stuck) or big jumps (cascading failures),
      // estimate where cursor SHOULD be based on audio timing ratio.
      // If cue is at 30% of audio duration, cursor should be near 30% of text length.
      if(!matched){
        const cueTime=cues[i].start;
        const timeRatio=cueTime/totalDuration;
        const expectedPos=Math.floor(timeRatio*spokenLen);
        // Gentle pull toward expected position
        // Cap at ~1.5x the average chars-per-cue to prevent overshooting
        const avgCharsPerCue=Math.max(5,Math.floor(spokenLen/effectiveCueCount));
        const maxAdvance=Math.floor(avgCharsPerCue*1.5);
        let newCursor=cursor;
        if(expectedPos>cursor){
          newCursor=cursor+Math.min(expectedPos-cursor,maxAdvance);
        }else{
          newCursor=cursor+1; // expected behind cursor, minimal advance
        }
        cursor=Math.min(segFull.length,newCursor);
        const curSeg=posToSeg(cursor);
        if(curSeg>lastSeg){
          segMap.push(curSeg);
          if(DBG)dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'MISS',seg:curSeg,score:0,cursor,misses:consecutiveMisses+1,expectedPos,timeRatio:timeRatio.toFixed(3),segText:segments[curSeg].text.slice(0,30)});
          lastSeg=curSeg;
        }else{
          segMap.push(lastSeg);
          if(DBG)dbgLog.push({cue:i,text:cues[i].text.slice(0,30),strategy:'MISS',seg:lastSeg,score:0,cursor,misses:consecutiveMisses+1,expectedPos,timeRatio:timeRatio.toFixed(3)});
        }
        consecutiveMisses++;
      }
    }
    // Fill remaining (truncated hallucination cues) with last segment
    for(let i=effectiveCueCount;i<cues.length;i++){
      segMap.push(Math.min(lastSeg,n-1));
    }

    // Derive segTimeRanges from first/last cue per segment
    const segFirst=new Array(n).fill(null);
    const segLast=new Array(n).fill(null);
    for(let i=0;i<segMap.length;i++){
      const s=segMap[i];
      if(s<0||s>=n)continue;
      if(segFirst[s]===null)segFirst[s]=i;
      segLast[s]=i;
    }

    for(let i=0;i<n;i++){
      if(segFirst[i]!==null){
        segTimeRanges.push({
          start:cues[segFirst[i]].start,
          end:cues[segLast[i]].end
        });
      }else{
        segTimeRanges.push(null);
      }
    }

    // Fill gaps by interpolation
    for(let i=0;i<n;i++){
      if(segTimeRanges[i]===null){
        let prev=null,next=null;
        for(let j=i-1;j>=0;j--){if(segTimeRanges[j]){prev={idx:j,...segTimeRanges[j]};break;}}
        for(let j=i+1;j<n;j++){if(segTimeRanges[j]){next={idx:j,...segTimeRanges[j]};break;}}
        if(prev&&next){
          const gap=next.start-prev.end;
          const spans=next.idx-prev.idx;
          const off=i-prev.idx;
          segTimeRanges[i]={
            start:prev.end+gap*(off-0.5)/spans,
            end:prev.end+gap*(off+0.5)/spans
          };
        }else if(prev){
          segTimeRanges[i]={start:prev.end,end:prev.end+0.5};
        }else if(next){
          segTimeRanges[i]={start:Math.max(0,next.start-0.5),end:next.start};
        }else{
          segTimeRanges[i]={start:0,end:cues[cues.length-1].end};
        }
      }
    }

    // Make continuous
    for(let i=1;i<n;i++){
      if(segTimeRanges[i].start>segTimeRanges[i-1].end){
        const mid=(segTimeRanges[i-1].end+segTimeRanges[i].start)/2;
        segTimeRanges[i-1].end=mid;
        segTimeRanges[i].start=mid;
      }else if(segTimeRanges[i].start<segTimeRanges[i-1].end){
        // Overlap - fix by splitting at the earlier segment's end
        segTimeRanges[i].start=segTimeRanges[i-1].end;
      }
    }
    segTimeRanges[0].start=0;
    segTimeRanges[n-1].end=cues[cues.length-1].end;

    // Debug: log alignment quality
    let matchedCount=0,missCount=0;
    for(let i=introEnd;i<effectiveCueCount;i++){
      // A cue is "matched" if its segMap entry differs from its predecessor's
      // or if it's the first one
      if(i===introEnd||segMap[i]!==segMap[i-1])matchedCount++;
    }
    missCount=effectiveCueCount-introEnd-matchedCount;
    const pct=effectiveCueCount>0?((matchedCount/(effectiveCueCount-introEnd))*100).toFixed(1):'0';
    console.log('[inline-audio] buildSegMap: '+effectiveCueCount+' cues, '+n+' segments, intro='+introEnd+', matched transitions='+matchedCount+', stayed='+missCount+' ('+pct+'% transition rate)');
    // Log segments with no cues (potential skip targets)
    const emptySeg=[];
    for(let i=0;i<n;i++){if(segFirst[i]===null)emptySeg.push(i);}
    if(emptySeg.length>0)console.log('[inline-audio] segments with NO cues (interpolated time):',emptySeg.join(','),'out of',n);
    // Log time ranges
    console.log('[inline-audio] segTimeRanges:',segTimeRanges.map((r,i)=>i+':'+r.start.toFixed(1)+'-'+r.end.toFixed(1)).join(' | '));

    // Debug: detailed per-cue alignment log
    if(DBG&&dbgLog.length>0){
      console.groupCollapsed('[inline-audio][debug] Per-cue alignment details ('+dbgLog.length+' entries)');
      // Strategy distribution
      const stratCount={};
      for(const d of dbgLog){stratCount[d.strategy]=(stratCount[d.strategy]||0)+1;}
      console.log('[inline-audio][debug] Strategy distribution:',stratCount);
      // Show all entries as table
      console.table(dbgLog.map(d=>({
        '#':d.cue,
        text:d.text,
        strategy:d.strategy,
        seg:d.seg,
        score:typeof d.score==='number'?d.score.toFixed(3):'-',
        cursor:d.cursor,
        jump:d.jumpDist||'-',
        misses:d.misses||'-',
        segText:d.segText||'-'
      })));
      // Highlight misses
      const misses=dbgLog.filter(d=>d.strategy==='MISS');
      if(misses.length>0){
        console.groupCollapsed('[inline-audio][debug] ⚠ MISSES: '+misses.length+' cues unmatched');
        for(const m of misses){
          console.log('  cue#'+m.cue+' "'+m.text+'" → stuck at seg '+m.seg+' (consecutive misses: '+m.misses+')');
        }
        console.groupEnd();
      }
      // Segments overview: which segments got how many cues
      const segCueCounts=new Array(n).fill(0);
      for(const si of segMap)segCueCounts[si]++;
      console.groupCollapsed('[inline-audio][debug] Segment cue distribution');
      for(let i=0;i<n;i++){
        const tag=segFirst[i]===null?'(EMPTY)':segCueCounts[i]+' cues';
        console.log('  seg#'+i+': '+tag+' ['+segTimeRanges[i].start.toFixed(1)+'s-'+segTimeRanges[i].end.toFixed(1)+'s] "'+segments[i].text.slice(0,40)+'"');
      }
      console.groupEnd();
      console.groupEnd();
    }

    return{segMap,segTimeRanges};
  }
};

const editToggle=$('editToggle');
let editMode=false;
let rawMarkdown=''; // raw markdown of current article

  if(!curId)return;
  if(editMode){
    exitEditMode(false);
  }else{
    enterEditMode();
  }
});

let _editScrollTop=0; // saved scroll position before entering edit mode

async function enterEditMode(){
  if(!curId)return;
  // Save scroll position before switching to edit mode
  _editScrollTop=ct.scrollTop;
  // Find first visible paragraph/heading text for smart scroll positioning
  let _targetText='';
  const artBody=ct.querySelector('.art-body');
  if(artBody){
    const els=artBody.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,blockquote,pre');
    const ctRect=ct.getBoundingClientRect();
    for(const el of els){
      const rect=el.getBoundingClientRect();
      if(rect.top>=ctRect.top-10){
        _targetText=el.textContent.trim().slice(0,60);
        break;
      }
    }
  }
  // Fetch raw markdown
  try{
    const r=await fetch('/vault/'+curId.split('/').map(s=>encodeURIComponent(s)).join('/'),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    rawMarkdown=await r.text();
  }catch(e){
    showToast('无法加载文件内容');
    return;
  }
  editMode=true;
  editToggle.innerHTML='<img src="/icon-192.png" alt="阅读" style="width:16px;height:16px;border-radius:3px;vertical-align:middle">';
  editToggle.title='阅读';
  editToggle.classList.add('active');
  // Replace content with editor
  ct.innerHTML='<div class="edit-wrap">'+
    '<div class="edit-toolbar">'+
      '<button class="edit-save" id="editSave">💾 保存</button>'+
      '<button id="editCancel">✕ 取消</button>'+
      '<span class="edit-hint">Ctrl+S / ⌘S 保存</span>'+
    '</div>'+
    '<textarea class="edit-textarea" id="editArea"></textarea>'+
  '</div>';
  const editArea=$('editArea');
  editArea.value=rawMarkdown;
  editArea.focus();
  // Smart scroll: find matching text position in raw markdown
  if(_targetText && _targetText.length>5){
    const searchStr=_targetText.slice(0,40);
    const lines=rawMarkdown.split('\n');
    let charPos=-1;
    for(let i=0;i<lines.length;i++){
      // Strip markdown syntax for matching
      const plainLine=lines[i].replace(/^#{1,6}\s+/,'').replace(/[\*\_\~\`]/g,'');
      if(plainLine.includes(searchStr.slice(0,30))){
        charPos=lines.slice(0,i).join('\n').length;
        break;
      }
    }
    if(charPos>=0){
      editArea.setSelectionRange(charPos,charPos);
      setTimeout(()=>{
        const linesBefore=rawMarkdown.slice(0,charPos).split('\n').length;
        const lineHeight=parseFloat(getComputedStyle(editArea).lineHeight)||20;
        editArea.scrollTop=Math.max(0,(linesBefore-2)*lineHeight);
      },50);
    }else{
      // Fallback: ratio-based scroll
      setTimeout(()=>{ editArea.scrollTop=_editScrollTop; },0);
    }
  }else{
    setTimeout(()=>{ editArea.scrollTop=_editScrollTop; },0);
  }
  // Auto-resize
  function autoResize(){
    editArea.style.height='auto';
    editArea.style.height=Math.max(400,editArea.scrollHeight)+'px';
  }
  editArea.addEventListener('input',autoResize);
  setTimeout(autoResize,0);
  // Save button
  $('editSave').addEventListener('click',()=>saveEdit());
  $('editCancel').addEventListener('click',()=>exitEditMode(false));
}

async function saveEdit(){
  const editArea=$('editArea');
  if(!editArea)return;
  const content=editArea.value;
  try{
    const r=await fetch('/vault/'+curId.split('/').map(s=>encodeURIComponent(s)).join('/'),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({content})
    });
    const d=await r.json();
    if(!d.ok){
      showToast('保存失败: '+(d.error||''));
      return;
    }
    // Success — exit edit mode and reload article
    exitEditMode(true);
  }catch(e){
    showToast('保存请求失败');
  }
}

function exitEditMode(){
  editMode=false;
  editToggle.textContent='📝';
  editToggle.title='编辑';
  editToggle.classList.remove('active');
  const savedScroll=_editScrollTop;
  if(curId){
    loadArticle(curId).then(()=>{
      setTimeout(()=>{ ct.scrollTop=savedScroll; },50);
    });
  }
}

// Ctrl+S / Cmd+S to save in edit mode
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){
    if(editMode){
      e.preventDefault();
      saveEdit();
    }
  }
});

// ── Start: check auth first ──────────────────────────
checkAuth();

// ── PWA: register service worker (offline app shell; dynamic content stays
// network-only — see /sw.js). Failure is non-fatal.
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('[sw] register failed:',e));
  });
}

}();
</script>
